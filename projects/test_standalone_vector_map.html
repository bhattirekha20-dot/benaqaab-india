<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Geocarto International Standalone Vector Map Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; width: 100vw; height: 100vh; }
    canvas { width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.77vh; background: #07090e; }
  </style>
</head>
<body>
  <canvas id="stage" width="1920" height="1080"></canvas>
  <script src="../viz/motion.js"></script>
  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');

    // Approximate boundary contour representing the western Rajasthan / Thar desert border
    const boundary = [
      [780, 50], [860, 120], [890, 200], [920, 260], [980, 310], [1020, 340],
      [1080, 320], [1160, 350], [1220, 390], [1280, 410], [1310, 480], [1370, 520],
      [1330, 580], [1390, 620], [1360, 680], [1290, 720], [1220, 740], [1180, 810],
      [1120, 850], [1130, 890], [1090, 910], [1070, 880], [1050, 840], [1020, 820],
      [990, 800], [940, 760], [860, 730], [780, 710], [700, 680], [640, 650],
      [580, 610], [520, 560], [480, 500], [460, 430], [450, 370], [490, 310],
      [530, 240], [580, 180], [660, 120], [730, 70], [780, 50]
    ];

    const epicenter = { x: 570, y: 560, label: 'Jaisalmer' };
    const faults = [
      { x1: 570, y1: 560, x2: 440, y2: 430, label: 'Ramgarh Fault', labelX: 300, labelY: 420 },
      { x1: 570, y1: 560, x2: 680, y2: 480, label: 'Kanoi Fault', labelX: 700, labelY: 475 },
      { x1: 570, y1: 560, x2: 420, y2: 640, label: 'Ghotaru Fault', labelX: 280, labelY: 645 },
      { x1: 570, y1: 560, x2: 500, y2: 720, label: 'Manhera Fault', labelX: 360, labelY: 730 }
    ];

    window.seek = function(t) {
      ctx.clearRect(0, 0, 1920, 1080);
      window.Motion.drawForensicVectorMap(ctx, t, 0, 10, {
        boundaryPoints: boundary,
        boundaryColor: '#f8fafc',
        boundaryWidth: 2.2,
        epicenter: epicenter,
        rings: [90, 160, 230, 300],
        ringColor: 'rgba(239, 68, 68, 0.7)',
        faults: faults,
        attribution: 'COURTESY: GEOCARTO INTERNATIONAL (2022)'
      });

      // Top-Left Brand Logo Pill
      ctx.save();
      ctx.fillStyle = 'rgba(8, 14, 26, 0.85)';
      ctx.strokeStyle = 'rgba(251, 191, 36, 0.4)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(76, 54, 210, 40, 20);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = '800 13px "JetBrains Mono", monospace';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText('BENAQAAB INDIA', 110, 74);
      ctx.restore();
    };

    window.seek(3.5);
  </script>
</body>
</html>
