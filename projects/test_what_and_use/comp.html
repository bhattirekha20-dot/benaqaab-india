<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Benaqaab Explainer: Semiconductor Microchips — 10 Visual Beats / Min</title>
  <style>
    @font-face { font-family: 'Outfit'; src: url('../../brand/fonts/SpaceGrotesk.ttf'); font-weight: 700; }
    @font-face { font-family: 'Inter'; src: url('../../brand/fonts/Inter.ttf'); font-weight: 400 800; }
    @font-face { font-family: 'JBM'; src: url('../../brand/fonts/JetBrainsMono.ttf'); font-weight: 500 800; }
    @font-face { font-family: 'Anton'; src: url('../../brand/fonts/Anton.ttf'); font-weight: 400; }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #05080c;
      color: #f1f5f9;
      font-family: 'Inter', -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    #viewport {
      position: relative;
      width: 450px;
      height: 800px;
      background: #000;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Interactive Player HUD */
    #player-controls {
      margin-top: 18px;
      width: 450px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 12px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .scrubber-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #time-slider {
      flex: 1;
      height: 6px;
      accent-color: #38bdf8;
      cursor: pointer;
    }

    #time-display {
      font-family: 'JBM', monospace;
      font-size: 13px;
      color: #94a3b8;
      width: 90px;
      text-align: right;
    }

    .btn-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    button {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    button:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: #38bdf8;
    }

    button.active {
      background: #38bdf8;
      color: #041019;
      border-color: #38bdf8;
    }

    .badge-info {
      font-size: 12px;
      color: #38bdf8;
      font-family: 'JBM', monospace;
    }
  </style>
  <script src="../../viz/motion.js"></script>
  <script src="../../viz/forensic_audio.js"></script>
</head>
<body>

  <div id="viewport">
    <canvas id="stage" width="1080" height="1920"></canvas>
  </div>

  <div id="player-controls">
    <div class="scrubber-row">
      <input type="range" id="time-slider" min="0" max="58.0" step="0.05" value="0">
      <span id="time-display">00.0s / 58.0s</span>
    </div>
    <div class="btn-row">
      <div class="btn-group">
        <button id="btn-play">▶ PLAY</button>
        <button id="btn-prev">-5s</button>
        <button id="btn-next">+5s</button>
      </div>
      <div class="btn-group">
        <button id="btn-audio">🔊 SFX ON</button>
      </div>
      <span class="badge-info">10 VISUALS / MINUTE</span>
    </div>
  </div>

  <script>
    'use strict';

    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const W = 1080, H = 1920;
    const DURATION = 58.0;

    // The 10 Mixed-Media Visual Assets (Minimum 10 per minute)
    const assetDefs = [
      { id: 'logo', src: '../../brand/logo.png' },
      { id: 'chipDie', src: 'assets/chip_macro_die.jpg' },
      { id: 'siliconIngot', src: 'assets/01_silicon_ingot.jpg' },
      { id: 'euvLaser', src: 'assets/02_euv_lithography.jpg' },
      { id: 'cleanroomFab', src: 'assets/03_cleanroom_fab.jpg' },
      { id: 'phoneSoC', src: 'assets/04_smartphone_soc.jpg' },
      { id: 'carECU', src: 'assets/car_ecu_chip.jpg' },
      { id: 'defenseRadar', src: 'assets/05_defense_radar_chip.jpg' },
      { id: 'supplyMap', src: 'assets/06_semiconductor_supply_map.jpg' },
      { id: 'dholeraFab', src: 'assets/07_dholera_fab_construction.jpg' },
      { id: 'ismGazette', src: 'assets/08_ism_gazette_approval.jpg' }
    ];

    const images = {};
    let loadedCount = 0;
    assetDefs.forEach(def => {
      const img = new Image();
      img.src = def.src;
      img.onload = () => {
        loadedCount++;
        if (loadedCount === assetDefs.length) {
          window.ready = true;
          render(currentTime);
        }
      };
      images[def.id] = img;
    });

    // Playback state
    let currentTime = 0.0;
    let isPlaying = false;
    let sfxEnabled = true;
    let lastStampTime = -1;
    let lastOdometerTick = -1;

    // Headless contract
    window.DURATION = DURATION;
    window.ready = false;
    window.seek = function(t) {
      currentTime = Math.max(0, Math.min(DURATION, t));
      render(currentTime);
      return Promise.resolve();
    };

    function render(t) {
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = '#060a10';
      ctx.fillRect(0, 0, W, H);

      // Sound triggers via Web Audio API
      if (sfxEnabled && typeof ForensicAudio !== 'undefined') {
        if (t >= 54.0 && t <= 54.2 && lastStampTime !== 54) {
          ForensicAudio.playStampThud();
          lastStampTime = 54;
        }
        if (t < 54.0) lastStampTime = -1;
        
        if (t >= 35.0 && t <= 38.0 && Math.floor(t * 10) !== lastOdometerTick) {
          ForensicAudio.playOdometerTick(0.08);
          lastOdometerTick = Math.floor(t * 10);
        }
      }

      // ─────────────────────────────────────────────────────────────
      // THE 10 SEQUENTIAL VISUAL BEATS (1 BEAT EVERY ~5.5 SECONDS)
      // ─────────────────────────────────────────────────────────────

      // BEAT 1 (0.0s - 5.5s): 5-6s ROADMAP HOOK + CHIP DIE BACKGROUND
      if (t < 5.5) {
        drawVisualWithVignette(ctx, images.chipDie, 0.0, 5.5, t, 0.04);
        drawRoadmapHookOverlay(ctx, t);
      }
      // BEAT 2 (5.5s - 11.0s): SILICON CRYSTAL INGOT EXTRACTION (1422°C)
      else if (t < 11.0) {
        drawVisualWithVignette(ctx, images.siliconIngot, 5.5, 11.0, t, 0.05);
        drawIngotAnnotation(ctx, t);
      }
      // BEAT 3 (11.0s - 16.5s): EUV PHOTOLITHOGRAPHY LASER SCANNER
      else if (t < 16.5) {
        drawVisualWithVignette(ctx, images.euvLaser, 11.0, 16.5, t, 0.05);
        drawEuvAnnotation(ctx, t);
      }
      // BEAT 4 (16.5s - 22.0s): NANO-SCALE TRANSISTOR DIE GRID & LOUPE
      else if (t < 22.0) {
        drawVisualWithVignette(ctx, images.chipDie, 16.5, 22.0, t, 0.06);
        drawDieMacroAnnotation(ctx, t);
      }
      // BEAT 5 (22.0s - 27.5s): STERILE CLEANROOM FAB & ROBOTIC FOUP
      else if (t < 27.5) {
        drawVisualWithVignette(ctx, images.cleanroomFab, 22.0, 27.5, t, 0.05);
        drawCleanroomAnnotation(ctx, t);
      }
      // BEAT 6 (27.5s - 33.0s): SMARTPHONE MOTHERBOARD SNAPDRAGON SOC
      else if (t < 33.0) {
        drawVisualWithVignette(ctx, images.phoneSoC, 27.5, 33.0, t, 0.05);
        drawPhoneSocAnnotation(ctx, t);
      }
      // BEAT 7 (33.0s - 38.5s): AUTOMOTIVE MASTER ECU & EV BLUEPRINT
      else if (t < 38.5) {
        drawVisualWithVignette(ctx, images.carECU, 33.0, 38.5, t, 0.05);
        drawCarEcuAnnotation(ctx, t);
      }
      // BEAT 8 (38.5s - 44.0s): DEFENSE AESA RADAR GUIDANCE COMPUTER
      else if (t < 44.0) {
        drawVisualWithVignette(ctx, images.defenseRadar, 38.5, 44.0, t, 0.05);
        drawDefenseRadarAnnotation(ctx, t);
      }
      // BEAT 9 (44.0s - 49.5s): GLOBAL CHIP SUPPLY CHAIN & CHOKEPOINTS
      else if (t < 49.5) {
        drawVisualWithVignette(ctx, images.supplyMap, 44.0, 49.5, t, 0.05);
        drawSupplyMapAnnotation(ctx, t);
      }
      // BEAT 10 (49.5s - 54.0s): DHOLERA SILICON FAB MEGA-STRUCTURE
      else if (t < 54.0) {
        drawVisualWithVignette(ctx, images.dholeraFab, 49.5, 54.0, t, 0.05);
        drawDholeraAnnotation(ctx, t);
      }
      // BEAT 11 / CLIMAX (54.0s - 58.0s): OFFICIAL GAZETTE & VERDICT STAMP
      else {
        drawVisualWithVignette(ctx, images.ismGazette, 54.0, 58.0, t, 0.04);
        drawVerdictAndClose(ctx, t);
      }

      // Visual Counter HUD Badge (Top Right)
      drawVisualBeatIndicator(ctx, t);

      // Persistent Top-Left Brand Logo Bug
      drawBrandLogo(ctx, t);
    }

    // Helper: Cinematic Ken Burns Drift + Contrast Vignette
    function drawVisualWithVignette(ctx, img, startT, endT, t, zoomRate = 0.05) {
      if (!img || !img.complete || !img.naturalWidth) return;
      const progress = Math.min(1, Math.max(0, (t - startT) / (endT - startT)));
      const scale = 1.0 + progress * zoomRate;

      ctx.save();
      ctx.translate(W / 2, H / 2);
      ctx.scale(scale, scale);
      ctx.translate(-W / 2, -H / 2);
      ctx.drawImage(img, 0, 0, W, H);
      ctx.restore();

      // Top contrast vignette
      const vTop = ctx.createLinearGradient(0, 0, 0, 380);
      vTop.addColorStop(0, 'rgba(4, 7, 12, 0.95)');
      vTop.addColorStop(1, 'rgba(4, 7, 12, 0.0)');
      ctx.fillStyle = vTop;
      ctx.fillRect(0, 0, W, 380);

      // Bottom contrast vignette
      const vBottom = ctx.createLinearGradient(0, 1420, 0, H);
      vBottom.addColorStop(0, 'rgba(4, 7, 12, 0.0)');
      vBottom.addColorStop(1, 'rgba(4, 7, 12, 0.95)');
      ctx.fillStyle = vBottom;
      ctx.fillRect(0, 1420, W, H - 1420);
    }

    // Top Right: Visual Beat Counter Badge
    function drawVisualBeatIndicator(ctx, t) {
      const beatNum = t < 5.5 ? 1 : Math.min(10, Math.floor((t - 5.5) / 5.25) + 2);
      ctx.save();
      ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
      ctx.beginPath();
      ctx.roundRect(W - 240, 42, 180, 44, 22);
      ctx.fill();
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.fillStyle = '#38bdf8';
      ctx.font = '800 16px "JBM", monospace';
      ctx.fillText(`VISUAL ${beatNum}/10`, W - 220, 70);
      ctx.restore();
    }

    // ─────────────────────────────────────────────────────────────
    // ACT 0: 5-6s ROADMAP HOOK (BEAT 1)
    // ─────────────────────────────────────────────────────────────
    function drawRoadmapHookOverlay(ctx, t) {
      // Category Badge
      ctx.save();
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.roundRect(80, 240, 360, 44, 22);
      ctx.fill();
      ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = '#38bdf8';
      ctx.font = '700 17px "JBM", monospace';
      ctx.fillText('⚡ 5-SECOND ROADMAP HOOK', 105, 269);
      ctx.restore();

      ctx.fillStyle = '#ffffff';
      ctx.font = '900 64px "Inter", sans-serif';
      ctx.fillText('SEMICONDUCTOR CHIPS', 80, 350);

      ctx.fillStyle = '#94a3b8';
      ctx.font = '600 30px sans-serif';
      ctx.fillText('Iss video mein hum cover karenge:', 80, 405);

      const points = [
        { num: '01', en: 'WHAT IS IT?', hi: 'यह आखिर क्या है? (Silicon & Transistors)', start: 0.0, end: 2.0 },
        { num: '02', en: 'HOW IT WORKS?', hi: 'काम कैसे करता है? (Binary 0 & 1 Logic)', start: 2.0, end: 3.8 },
        { num: '03', en: 'REAL-WORLD USE', hi: 'इसका असली इस्तेमाल क्या है? (Phones to Cars)', start: 3.8, end: 5.5 }
      ];

      const startY = 460;
      points.forEach((pt, idx) => {
        const y = startY + idx * 150;
        const isActive = t >= pt.start && t < pt.end;
        const isPassed = t >= pt.end;

        ctx.save();
        ctx.fillStyle = isActive ? 'rgba(15, 23, 42, 0.96)' : 'rgba(15, 23, 42, 0.6)';
        ctx.beginPath();
        ctx.roundRect(80, y, W - 160, 120, 16);
        ctx.fill();

        ctx.strokeStyle = isActive ? '#38bdf8' : (isPassed ? '#10b981' : 'rgba(255, 255, 255, 0.1)');
        ctx.lineWidth = isActive ? 2.5 : 1;
        ctx.stroke();

        ctx.fillStyle = isActive ? '#38bdf8' : (isPassed ? '#10b981' : '#475569');
        ctx.beginPath();
        ctx.roundRect(80, y, 10, 120, [16, 0, 0, 16]);
        ctx.fill();

        ctx.fillStyle = isActive ? '#38bdf8' : (isPassed ? '#10b981' : '#64748b');
        ctx.font = '800 26px "JBM", monospace';
        ctx.fillText(pt.num, 115, y + 48);

        ctx.fillStyle = isActive ? '#ffffff' : (isPassed ? '#cbd5e1' : '#94a3b8');
        ctx.font = '800 30px "Inter", sans-serif';
        ctx.fillText(pt.en, 180, y + 48);

        ctx.fillStyle = isActive ? '#38bdf8' : (isPassed ? '#a7f3d0' : '#64748b');
        ctx.font = '600 22px sans-serif';
        ctx.fillText(pt.hi, 180, y + 90);

        if (isPassed) {
          ctx.fillStyle = '#10b981'; ctx.font = '800 26px sans-serif';
          ctx.fillText('✓', W - 140, y + 68);
        } else if (isActive) {
          ctx.fillStyle = '#38bdf8'; ctx.font = '800 18px "JBM", monospace';
          ctx.fillText('ACTIVE', W - 170, y + 68);
        }
        ctx.restore();
      });

      drawSubtitlePill(ctx, 'Iss video mein hum cover karenge: Semiconductor Microchips — yeh aakhir kya hai aur iska real use kya hai.');
    }

    // BEAT 2: SILICON INGOT
    function drawIngotAnnotation(ctx, t) {
      drawActBadge(ctx, 'STEP 1 OF 3 : RAW MATERIAL', 'CZ-12 HIGH TEMP SILICON GROWTH');
      Motion.drawCalloutPin(ctx, t, 6.0, 520, 840, 820, 680, 'CZOCHRALSKI FURNACE', '1422°C par molten silicon se single crystal ingot nikalna', '#fbbf24');
      drawSubtitlePill(ctx, 'Pehla sawal: Yeh banta kaise hai? Ret (Sand) ko 1422°C par pighla kar pure silicon crystal banaya jata hai.');
    }

    // BEAT 3: EUV LITHOGRAPHY
    function drawEuvAnnotation(ctx, t) {
      drawActBadge(ctx, 'STEP 2 OF 3 : CIRCUIT ETCHING', 'ASML EUV 13.5nm LASER SCANNER');
      Motion.drawCalloutPin(ctx, t, 11.5, 540, 1260, 200, 1120, 'EUV LASER MIRRORS', 'Extreme Ultraviolet roshni se circuits print hote hain', '#38bdf8');
      drawSubtitlePill(ctx, 'Phir shuru hoti hai photolithography — jahan laser roshni se wafer par Arabon circuits print hote hain.');
    }

    // BEAT 4: DIE MACRO & LOUPE
    function drawDieMacroAnnotation(ctx, t) {
      drawActBadge(ctx, 'STEP 3 OF 3 : NANOMETER ARCHITECTURE', '100 BILLION TRANSISTORS PER DIE');
      Motion.drawEvidenceLoupe(ctx, t, 17.0, 520, 840, 90, 2.0);
      Motion.drawCalloutPin(ctx, t, 18.0, 520, 760, 160, 640, '2-NANOMETER GATE', 'Ek baal se 50,000 guna chhota transistor switch', '#38bdf8');
      drawSubtitlePill(ctx, 'Yeh transistors sirf ek kaam karte hain: Bijli ko ek second mein Arabon baar ON aur OFF karna (0 aur 1 binary data).');
    }

    // BEAT 5: CLEANROOM FAB
    function drawCleanroomAnnotation(ctx, t) {
      drawActBadge(ctx, 'MANUFACTURING REALITY', 'CLASS 1 ZERO-DUST CLEANROOM');
      Motion.drawCalloutPin(ctx, t, 22.5, 530, 620, 840, 480, 'AEROSPACE BUNNY SUIT', 'Ek dhool ka kan bhi poori chip ko barbaad kar sakta hai', '#fbbf24');
      drawSubtitlePill(ctx, 'Yeh process itna nazuk hai ki hospital se 1,000 guna zyada sterile cleanroom mein kaam hota hai.');
    }

    // BEAT 6: SMARTPHONE SOC
    function drawPhoneSocAnnotation(ctx, t) {
      drawActBadge(ctx, 'REAL-WORLD USE 1 : MOBILE COMPUTING', 'QUALCOMM SNAPDRAGON + SK HYNIX');
      Motion.drawCalloutPin(ctx, t, 28.0, 480, 840, 180, 720, 'FLAGSHIP SYSTEM-ON-CHIP', 'CPU, GPU aur AI Neural Engine ek chip ke andar', '#38bdf8');
      drawSubtitlePill(ctx, 'Iska pehla real use: Har smartphone mein 25 se zyada microchips hote hain camera, screen aur AI chalaane ke liye.');
    }

    // BEAT 7: CAR ECU & ODOMETER
    function drawCarEcuAnnotation(ctx, t) {
      drawActBadge(ctx, 'REAL-WORLD USE 2 : AUTOMOTIVE MOBILITY', 'MASTER ECU & EV BATTERY CONTROL');
      Motion.drawCalloutPin(ctx, t, 33.5, 540, 960, 840, 820, 'AUTOMOTIVE MASTER ECU', 'Engine timing, ABS brakes aur airbag ka dimaag', '#34d399');
      
      // Live 3,000-chip Odometer
      ctx.save();
      ctx.fillStyle = 'rgba(15, 23, 42, 0.94)';
      ctx.beginPath(); ctx.roundRect(80, 1340, W - 160, 110, 16); ctx.fill();
      ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = '#94a3b8'; ctx.font = '700 20px "JBM", monospace';
      ctx.fillText('CHIPS REQUIRED PER MODERN VEHICLE:', 110, 1378);
      Motion.drawOdometer(ctx, t, 34.0, 2.5, 0, 3000, '', ' CHIPS', W / 2, 1424);
      ctx.restore();

      drawSubtitlePill(ctx, 'Doosra use: Ek modern car mein kam se kam 1,500 se 3,000 chips lagte hain — bina chips ke factories band ho jati hain.');
    }

    // BEAT 8: DEFENSE RADAR CHIP
    function drawDefenseRadarAnnotation(ctx, t) {
      drawActBadge(ctx, 'REAL-WORLD USE 3 : NATIONAL DEFENSE', 'GaN AESA RADAR MIL-SPEC-810H');
      Motion.drawCalloutPin(ctx, t, 39.0, 540, 1100, 180, 960, 'FIGHTER RADAR PROCESSOR', 'Missile tracking aur satellite communication chips', '#ef4444');
      drawSubtitlePill(ctx, 'Teesra use: Fighter jets, radar aur missile guidance system sab kuch military microchips par depend karte hain.');
    }

    // BEAT 9: GLOBAL SUPPLY CHAIN MAP
    function drawSupplyMapAnnotation(ctx, t) {
      drawActBadge(ctx, 'GEOPOLITICAL REALITY', 'CHOKEPOINTS & SHIPPING CORRIDORS');
      Motion.drawCalloutPin(ctx, t, 44.5, 780, 940, 300, 820, 'TAIWAN & MALACCA STRAIT', 'Duniya ki 70% advanced chips ek akele chokepoint se aati hain', '#fbbf24');
      drawSubtitlePill(ctx, 'Yeh aisi supply chain hai jahan ek akele island ya samundri raste par rukawat poori duniya ko rok sakti hai.');
    }

    // BEAT 10: DHOLERA FAB BLUEPRINT
    function drawDholeraAnnotation(ctx, t) {
      drawActBadge(ctx, 'ATMANIRBHAR BHARAT', 'INDIA SEMICONDUCTOR MISSION');
      Motion.drawCalloutPin(ctx, t, 50.0, 520, 720, 840, 580, 'DHOLERA MEGA SILICON FAB', '₹1.64 Lakh Crore: Bharat ka pehla commercial fab', '#10b981');
      drawSubtitlePill(ctx, 'Isi liye India ab Dholera mein apna pehla bada silicon fab khada kar raha hai taaki hum kisi par nirbhar na rahein.');
    }

    // BEAT 11 / CLIMAX: GAZETTE & VERDICT STAMP
    function drawVerdictAndClose(ctx, t) {
      drawActBadge(ctx, 'FINAL VERDICT', 'SACH · SABOOT · BEBAK');

      if (t >= 54.0) {
        Motion.drawVerdictStamp(ctx, t, 54.0, 'STRATEGIC ASSET', 'MODERN DUNIYA KA OXYGEN', W / 2, 740);
      }

      if (t >= 55.5) {
        ctx.fillStyle = '#f8fafc';
        ctx.font = '800 42px "Inter", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('SHOR NAHI, SOURCE KE SAATH.', W / 2, 1140);

        ctx.fillStyle = '#fbbf24';
        ctx.font = '800 32px "JBM", monospace';
        ctx.fillText('BENAQAAB INDIA', W / 2, 1200);
        ctx.textAlign = 'left';
      }

      drawSubtitlePill(ctx, 'Yeh component nahi, modern civilization ka oxygen hai. Shor nahi, source ke saath. Benaqaab India.');
    }

    // Helper: Act Category Badge
    function drawActBadge(ctx, cat, title) {
      ctx.save();
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.roundRect(80, 240, 480, 44, 22);
      ctx.fill();
      ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = '#38bdf8';
      ctx.font = '700 16px "JBM", monospace';
      ctx.fillText(`⚡ ${cat}`, 105, 269);

      ctx.fillStyle = '#ffffff';
      ctx.font = '900 52px "Inter", sans-serif';
      ctx.fillText(title, 80, 340);
      ctx.restore();
    }

    // Helper: Brand Logo
    function drawBrandLogo(ctx, t) {
      const logo = images.logo;
      if (logo && logo.complete && logo.naturalWidth) {
        ctx.save();
        ctx.globalAlpha = 0.92;
        ctx.drawImage(logo, 55, 42, 72, 72);
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 24px "Inter", sans-serif';
        ctx.fillText('BENAQAAB', 142, 76);
        ctx.fillStyle = '#94a3b8';
        ctx.font = '700 14px "JBM", monospace';
        ctx.fillText('INDIA', 142, 98);
        ctx.restore();
      }
    }

    // Helper: Subtitle Pill
    function drawSubtitlePill(ctx, text) {
      ctx.save();
      const pillY = 1620;
      const pillH = 120;
      ctx.fillStyle = 'rgba(10, 15, 24, 0.94)';
      ctx.beginPath();
      ctx.roundRect(80, pillY, W - 160, pillH, 20);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)'; ctx.lineWidth = 1; ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = '700 28px "Inter", sans-serif';
      ctx.textAlign = 'center';

      const words = text.split(' ');
      let line1 = '', line2 = '';
      for (let i = 0; i < words.length; i++) {
        if (i < words.length / 2) line1 += words[i] + ' ';
        else line2 += words[i] + ' ';
      }
      ctx.fillText(line1.trim(), W / 2, pillY + 48);
      ctx.fillStyle = '#fbbf24';
      ctx.fillText(line2.trim(), W / 2, pillY + 92);
      ctx.textAlign = 'left';
      ctx.restore();
    }

    // ─────────────────────────────────────────────────────────────
    // INTERACTIVE PLAYER CONTROLLER
    // ─────────────────────────────────────────────────────────────
    const slider = document.getElementById('time-slider');
    const timeDisplay = document.getElementById('time-display');
    const btnPlay = document.getElementById('btn-play');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnAudio = document.getElementById('btn-audio');

    function updateTime(t) {
      currentTime = Math.max(0, Math.min(DURATION, t));
      slider.value = currentTime;
      timeDisplay.textContent = `${currentTime.toFixed(1)}s / ${DURATION.toFixed(1)}s`;
      render(currentTime);
    }

    slider.addEventListener('input', (e) => {
      isPlaying = false;
      btnPlay.textContent = '▶ PLAY';
      btnPlay.classList.remove('active');
      updateTime(parseFloat(e.target.value));
    });

    btnPlay.addEventListener('click', () => {
      isPlaying = !isPlaying;
      btnPlay.textContent = isPlaying ? '⏸ PAUSE' : '▶ PLAY';
      btnPlay.classList.toggle('active', isPlaying);
      if (isPlaying && currentTime >= DURATION) currentTime = 0;
      if (isPlaying) lastFrameTime = performance.now();
    });

    btnPrev.addEventListener('click', () => updateTime(currentTime - 5.0));
    btnNext.addEventListener('click', () => updateTime(currentTime + 5.0));

    btnAudio.addEventListener('click', () => {
      sfxEnabled = !sfxEnabled;
      btnAudio.textContent = sfxEnabled ? '🔊 SFX ON' : '🔇 SFX MUTED';
      btnAudio.classList.toggle('active', !sfxEnabled);
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') { e.preventDefault(); btnPlay.click(); }
      else if (e.code === 'ArrowLeft') updateTime(currentTime - 1.0);
      else if (e.code === 'ArrowRight') updateTime(currentTime + 1.0);
      else if (e.code === 'KeyM') btnAudio.click();
    });

    let lastFrameTime = performance.now();
    function loop(now) {
      if (isPlaying) {
        const dt = (now - lastFrameTime) / 1000;
        currentTime += dt;
        if (currentTime >= DURATION) {
          currentTime = DURATION;
          isPlaying = false;
          btnPlay.textContent = '▶ PLAY';
          btnPlay.classList.remove('active');
        }
        slider.value = currentTime;
        timeDisplay.textContent = `${currentTime.toFixed(1)}s / ${DURATION.toFixed(1)}s`;
        render(currentTime);
      }
      lastFrameTime = now;
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
