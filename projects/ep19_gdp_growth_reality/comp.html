<!DOCTYPE html>

<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&family=Kalam:wght@400;700&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #07090e;
      color: #f8fafc;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 60px;
    }
    body.render-mode,
    body.render-mode html {
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      background: #000 !important;
      width: 1920px !important;
      height: 1080px !important;
    }
    body.render-mode header,
    body.render-mode .controls-bar {
      display: none !important;
    }
    body.render-mode .stage-container,
    body.render-mode .canvas-wrapper {
      max-width: none !important;
      width: 1920px !important;
      height: 1080px !important;
      margin: 0 !important;
      padding: 0 !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
    }
    body.render-mode canvas {
      width: 1920px !important;
      height: 1080px !important;
      display: block !important;
    }
    header {
      width: 100%;
      max-width: 1440px;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(10, 15, 24, 0.88);
      backdrop-filter: blur(16px);

      top: 0;
      z-index: 100;
    }
    .brand-group { display: flex; align-items: center; gap: 14px; }
    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(251, 191, 36, 0.6);
      box-shadow: 0 0 12px rgba(251, 191, 36, 0.3);
      background: #000;
    }
    .brand-title { font-size: 18px; font-weight: 800; letter-spacing: 0.8px; color: #fff; }
    .brand-tag { font-size: 11px; font-weight: 700; color: #fbbf24; letter-spacing: 1.8px; text-transform: uppercase; }
    .meta-pills { display: flex; align-items: center; gap: 10px; }
    .pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;

    .pill.gold { border-color: rgba(251, 191, 36, 0.4); color: #fbbf24; background: rgba(251, 191, 36, 0.08); }
    .pill.flame { border-color: rgba(244, 63, 94, 0.4); color: #f43f5e; background: rgba(244, 63, 94, 0.08); }

    .stage-container {
      width: 100%;
      max-width: 1440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 20px;
      padding: 0 16px;
    }
    .canvas-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 255, 255, 0.12);
    }
    canvas { width: 100%; height: 100%; display: block; }

    .controls-bar {
      width: 100%;
      margin-top: 18px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 16px 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      backdrop-filter: blur(16px);
    }
    .timeline-row { display: flex; align-items: center; gap: 16px; width: 100%; }
    .time-readout {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      color: #38bdf8;
      min-width: 130px;
    }
    .scrubber {
      flex: 1;
      height: 8px;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }
    .scrubber::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.9);
      cursor: pointer;
    }
    .buttons-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .btn-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    button {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f8fafc;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    button:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.4);
      color: #38bdf8;
    }
    button.primary {
      background: #38bdf8;
      color: #07090e;
      border-color: #38bdf8;
      font-weight: 700;
    }
    button.primary:hover {
      background: #0ea5e9;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }
    .beat-info-badge {
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .beat-highlight {
      color: #fbbf24;
      font-family: 'JetBrains Mono', monospace;
    }
  </style>

<body>
  <header>
    <div class="brand-group">
      <img src="../../brand/logo.png" alt="Benaqaab India" class="brand-logo" onerror="this.style.display='none'">
      <div>
        <div class="brand-title">BENAQAAB INDIA</div>
        <div class="brand-tag">SACH · SABOOT · BEBAK</div>
      </div>
    </div>
    <div class="meta-pills">
      <span class="pill gold" id="hud-beat-pill">BEAT 1 / 105</span>
      <span class="pill accent" id="hud-chapter">CH 1: GLOBAL HEADLINE</span>
      <span class="pill">16:9 4K CANVAS</span>
      <span class="pill flame">EP-19 MASTER</span>
    </div>
  </header>

  <main class="stage-container">
    <div class="canvas-wrapper">
      <canvas id="stage" width="1920" height="1080"></canvas>
    </div>

    <div class="controls-bar">
      <div class="timeline-row">
        <span class="time-readout" id="time-display">00:00 / 10:08</span>
        <input type="range" class="scrubber" id="scrubber" min="0" max="608.35" step="0.05" value="0">
      </div>
      <div class="buttons-row">
        <div class="btn-group">
          <button id="btn-play" class="primary">▶ PLAY</button>
          <button id="btn-restart">⏮ 00:00</button>
          <button id="btn-ch1">CH 1: 00:00</button>
          <button id="btn-ch2">CH 2: 01:23</button>
          <button id="btn-ch3">CH 3: 02:53</button>
          <button id="btn-ch4">CH 4: 04:36</button>
          <button id="btn-ch5">CH 5: 05:56</button>
          <button id="btn-ch6">CH 6: 07:22</button>
          <button id="btn-ch7">CH 7: 08:45</button>
        </div>
        <div class="beat-info-badge">
          <span>ACTIVE BEAT:</span>
          <span class="beat-highlight" id="beat-name">Opening Burning Question Hook</span>
        </div>
      </div>
    </div>
  </main>

  <audio id="master-audio" src="master_audio.mp3" preload="auto"></audio>

  <!-- External Engine Scripts -->
  <script src="../../viz/motion.js"></script>
  <script src="captions.js"></script>
  <script src="diagrams.js"></script>
  <script src="forensic_overlays.js"></script>
  <script src="beats.js"></script>

  <script>
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const scrubber = document.getElementById('scrubber');
  const timeDisplay = document.getElementById('time-display');
  const btnPlay = document.getElementById('btn-play');
  const btnRestart = document.getElementById('btn-restart');
  const masterAudio = document.getElementById('master-audio');
  const beatName = document.getElementById('beat-name');
  const hudBeatPill = document.getElementById('hud-beat-pill');
  const hudChapter = document.getElementById('hud-chapter');

  const TOTAL_DURATION = window.TOTAL_DURATION || 608.352;
  const beatsData = window.BEATS_DATA || [];

  let currentTime = 0;
  let isPlaying = false;
  let animFrameId = null;
  let lastTimestamp = performance.now();

  // Preload Brand Logo & Visual Assets (Both primary and fallback paths)
  const logoImg = new Image();
  logoImg.src = '../../brand/logo.png';

  const imageCache = {};
  beatsData.forEach(b => {
    [b.asset_path, b.fallback_path].forEach(p => {
      if (p && !imageCache[p]) {
        const img = new Image();
        img.src = p;
        imageCache[p] = img;
      }
    });
  });

  function formatTime(s) {
    const mins = Math.floor(s / 60);
    const secs = Math.floor(s % 60);
    return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
  }

  function getActiveBeat(t) {
    for (let i = 0; i < beatsData.length; i++) {
      if (t >= beatsData[i].start_s && t < beatsData[i].end_s) {
        return beatsData[i];
      }
    }
    return beatsData[beatsData.length - 1];
  }

  let isSeekingAudio = false;

  // Pure deterministic seek function
  window.seek = function(t) {
    currentTime = Math.max(0, Math.min(TOTAL_DURATION, t));
    scrubber.value = currentTime;
    timeDisplay.textContent = `${formatTime(currentTime)} / 10:08`;
    isSeekingAudio = true;
    try {
      masterAudio.currentTime = currentTime;
    } catch (e) {
      console.warn('Audio seek deferred:', e);
    }
    render(currentTime);
  };

  masterAudio.addEventListener('seeked', () => {
    isSeekingAudio = false;
  });

  function render(t) {
    // 0. Base canvas clear
    ctx.fillStyle = '#07090e';
    ctx.fillRect(0, 0, 1920, 1080);

    const activeBeat = getActiveBeat(t);
    if (!activeBeat) return;

    hudBeatPill.textContent = `BEAT ${activeBeat.beat_id} / ${beatsData.length}`;
    hudChapter.textContent = activeBeat.chapter.split(':')[0].toUpperCase();
    beatName.textContent = activeBeat.subject;

    const beatDur = Math.max(0.1, activeBeat.end_s - activeBeat.start_s);
    const beatProgress = Math.max(0, Math.min(1, (t - activeBeat.start_s) / beatDur));

    // 1. DRAW HERO IMAGE WITH VIRTUAL CAMERA DRIFT (WITH RESILIENT FALLBACK)
    let img = imageCache[activeBeat.asset_path];
    if (!img || !img.complete || img.naturalWidth === 0) {
      if (activeBeat.fallback_path && imageCache[activeBeat.fallback_path] && imageCache[activeBeat.fallback_path].complete && imageCache[activeBeat.fallback_path].naturalWidth > 0) {
        img = imageCache[activeBeat.fallback_path];
      }
    }
    if (img && img.complete && img.naturalWidth > 0) {
      ctx.save();
      ctx.translate(960, 540);
      
      // Virtual camera Ken Burns subtle zoom and drift
      const camScale = 1.0 + beatProgress * 0.035;
      const camPanX = (beatProgress - 0.5) * 14;
      ctx.scale(camScale, camScale);
      ctx.translate(camPanX, 0);

      // 16:9 full-bleed draw
      ctx.drawImage(img, -960, -540, 1920, 1080);
      ctx.restore();
    } else {
      const bgGrad = ctx.createRadialGradient(960, 540, 100, 960, 540, 1000);
      bgGrad.addColorStop(0, '#0c1222');
      bgGrad.addColorStop(1, '#04060a');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, 1920, 1080);
    }

    // 2. CINEMATIC VIGNETTE & LIVING TEXTURE (ZERO PROMPT BOXES, ZERO CRUDE LINES)
    const vigGrad = ctx.createRadialGradient(960, 540, 520, 960, 540, 1150);
    vigGrad.addColorStop(0, 'rgba(0,0,0,0)');
    vigGrad.addColorStop(0.7, 'rgba(7, 9, 14, 0.28)');
    vigGrad.addColorStop(1, 'rgba(4, 6, 10, 0.75)');
    ctx.fillStyle = vigGrad;
    ctx.fillRect(0, 0, 1920, 1080);

    // Subtle 3% Grain Overlay
    if (window.Motion && Motion.drawGrain) {
      Motion.drawGrain(ctx, 1920, 1080, 0.03);
    }

    // 3. TOP-LEFT LOGO BUG (CLEAN, NO DEBUG BADGES ON SCREEN)
    ctx.save();
    const pillX = 40, pillY = 34, pillW = 216, pillH = 42, pillR = 21;
    ctx.fillStyle = 'rgba(12, 16, 24, 0.85)';
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.16)';
    ctx.lineWidth = 1;
    ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.roundRect(pillX, pillY, pillW, pillH, pillR);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Circular avatar logo on left
    const iconX = pillX + 7;
    const iconY = pillY + 7;
    const iconSize = 28;
    ctx.save();
    ctx.beginPath();
    ctx.arc(iconX + iconSize/2, iconY + iconSize/2, iconSize/2, 0, Math.PI * 2);
    ctx.clip();
    if (logoImg.complete && logoImg.naturalWidth > 0) {
      ctx.drawImage(logoImg, iconX, iconY, iconSize, iconSize);
    } else {
      ctx.fillStyle = '#fbbf24';
      ctx.fillRect(iconX, iconY, iconSize, iconSize);
      ctx.fillStyle = '#000';
      ctx.font = '900 13px Inter, sans-serif';
      ctx.fillText('BI', iconX + 6, iconY + 19);
    }
    ctx.restore();

    ctx.strokeStyle = 'rgba(251, 191, 36, 0.6)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(iconX + iconSize/2, iconY + iconSize/2, iconSize/2, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.font = '800 14px -apple-system, BlinkMacSystemFont, "Inter", sans-serif';
    ctx.fillText('BENAQAAB INDIA', iconX + iconSize + 11, pillY + 26);
    ctx.restore();

    // 4. BESPOKE FORENSIC MOTION GRAPHICS OVERLAYS (CAUSALLY TIMED TO SPOKEN BEATS)
    if (window.Motion) {
      // 4.1 Opening 5.5s Roadmap Hook (0.0s to 5.5s)
      if (t < 5.5) {
        Motion.drawRoadmapCard(ctx, t, 0.0, 5.5, [
          { en: '01. 7.8% GDP VS SAVINGS COLLAPSE', hi: '330 लाख करोड़ जीडीपी बनाम 5.3% घरेलू बचत' },
          { en: '02. PER-CAPITA RANK #136 DISPARITY', hi: 'सकल आकार 5वां, लेकिन प्रति व्यक्ति 2,730 डॉलर' },
          { en: '03. THE 2045 DEMOGRAPHIC CLOCK', hi: 'अमीर बनने से पहले बूढ़ा होने का गंभीर ख़तरा' }
        ], 960, 540, 1080);
      }

      // 4.2 Animated Channel Subscribe & Like CTA (60.1s to 64.3s)
      // Exactly timed to VO: "चैनल को सब्सक्राइब करके बेल आइकन ज़रूर दबाएं!"
      if (t >= 60.1 && t <= 64.3) {
        Motion.drawSubscribeLikeCTA(ctx, t, 60.1, 4.2, logoImg, 960, 780);
      }

      // 4.3 MoSPI Official Press Note with Lively Yellow Highlighter (64.3s to 83.4s)
      // VO: "पहले अफ़िशल डेटा देखिए: मिनिस्ट्री ऑफ़ स्टैटिस्टिक्स... रियल जीडीपी 7.8% और जीवीए 8.2%..."
      if (t >= 64.29 && t <= 83.45) {
        // Stroke 1: Highlights "7.8% in Q1 2026-27" line in key highlights
        if (t >= 67.0) {
          Motion.drawLivelyHighlighter(ctx, t, 67.0, 1.8, 626, 402, 148, 24, 'rgba(253, 224, 71, 0.75)');
        }
        // Stroke 2: Highlights "8.2%" line
        if (t >= 71.0) {
          Motion.drawLivelyHighlighter(ctx, t, 71.0, 1.6, 750, 430, 48, 24, 'rgba(253, 224, 71, 0.75)');
        }
        // Rolling Odometer in bottom-right corner
        Motion.drawOdometer(ctx, t, 67.5, 2.5, 6.7, 7.8, 'REAL GDP: ', '%', 1540, 960, '#10b981');
      }

      // 4.4 World Bank Circular 2.5x Forensic Loupe (121.5s to 148.5s)
      // VO: "वर्ल्ड बैंक के डेटा के मुताबिक़, भारत की पर कैपिटा इनकम लगभग 2,730 डॉलर्स... 136वें नंबर पर..."
      if (t >= 121.45 && t <= 148.53) {
        if (t >= 126.0) {
          const wbImg = imageCache['assets/official_sources/src_03_worldbank_per_capita_ranking.png'] || img;
          Motion.drawEvidenceLoupe(ctx, t, 126.0, 1170, 719, 165, 2.2, wbImg);
        }
      }

      // 4.5 SIAM Automobile Flash Report Highlighters (224.6s to 260.0s)
      // VO: "लग्ज़री एसयूवीज़ में 24.5% का भारी उछाल... छोटी गाड़ियां minus 42%..."
      if (t >= 224.59 && t <= 242.08) {
        // Green highlight on Luxury SUVs +24.5%
        Motion.drawLivelyHighlighter(ctx, t, 227.0, 1.8, 1016, 402, 150, 24, 'rgba(74, 222, 128, 0.75)');
        Motion.drawOdometer(ctx, t, 227.5, 2.2, 0, 24.5, 'LUXURY BOOM: +', '%', 1540, 960, '#34d399');
      }

      // 4.6 RBI Financial Stability Report Crimson Highlighters & Debt Odometer (282.4s to 336.0s)
      // VO: "आरबीआई रिपोर्ट: नेट फ़ाइनेंशियल सेविंग्स गिर कर 5.3% पर... क़र्ज़ बढ़कर 45.8%..."
      if (t >= 282.36 && t <= 318.56) {
        // Crimson highlight on 5.3% savings
        Motion.drawLivelyHighlighter(ctx, t, 287.0, 2.0, 784, 402, 96, 24, 'rgba(248, 113, 113, 0.75)');
        Motion.drawOdometer(ctx, t, 287.5, 2.5, 8.2, 5.3, 'NET SAVINGS: ', '% GDP', 1540, 960, '#ef4444');
      }
      if (t >= 318.56 && t <= 336.00) {
        // Crimson highlight on 45.8% debt
        Motion.drawLivelyHighlighter(ctx, t, 321.0, 2.0, 886, 430, 104, 24, 'rgba(248, 113, 113, 0.75)');
        Motion.drawOdometer(ctx, t, 321.5, 2.5, 36.5, 45.8, 'HOUSEHOLD DEBT: ', '% GDP', 1540, 960, '#ef4444');
      }

      // 4.7 Manufacturing 15.8% Share Highlighter (431.2s to 450.4s)
      if (t >= 431.23 && t <= 450.38) {
        Motion.drawLivelyHighlighter(ctx, t, 434.0, 2.0, 800, 414, 55, 26, 'rgba(129, 140, 248, 0.75)');
        Motion.drawOdometer(ctx, t, 434.5, 2.2, 25.0, 15.8, 'MANUFACTURING: ', '% GDP', 1540, 960, '#818cf8');
      }

      // 4.8 2045 Demographic Clock Highlighter (484.8s to 510.0s)
      if (t >= 484.82 && t <= 510.04) {
        Motion.drawLivelyHighlighter(ctx, t, 488.0, 2.0, 680, 416, 60, 30, 'rgba(251, 146, 60, 0.75)');
      }

      // 4.9 Final Climactic Forensic Verdict Stamp Slam (600.0s to 608.35s)
      if (t >= 600.5) {
        Motion.drawVerdictStamp(ctx, t, 601.0, 'FINAL VERDICT: REALITY UNVEILED', 'सच · सबूत · बेबाक', 960, 540);
      }
    }

    // 5. BESPOKE FORENSIC MOTION GRAPHICS DIAGRAMS OVERLAYS (RENDERED ON TOP OF HERO PLATES)
    const isDiagramActive = (
      (t >= 64.29 && t <= 83.45) ||
      (t >= 148.53 && t <= 173.16) ||
      (t >= 185.71 && t <= 224.59) ||
      (t >= 335.95 && t <= 361.60) ||
      (t >= 500.18 && t <= 525.70) ||
      (t >= 532.37 && t <= 572.61)
    );
    if (isDiagramActive) {
      // Soft localized radial focus directly behind diagram, leaving perimeter and hero photography vivid and clearly visible
      const diagGrad = ctx.createRadialGradient(960, 540, 180, 960, 540, 1050);
      diagGrad.addColorStop(0, 'rgba(4, 7, 14, 0.20)');
      diagGrad.addColorStop(1, 'rgba(4, 7, 14, 0.02)');
      ctx.fillStyle = diagGrad;
      ctx.fillRect(0, 0, 1920, 1080);
    }

    if (window.Diagrams) {
      Diagrams.drawGdpGvaDiagram(ctx, t, 64.29, 83.45);
      Diagrams.drawPerCapitaComparisonDiagram(ctx, t, 148.53, 173.16);
      Diagrams.drawKShapedDivergenceDiagram(ctx, t, 185.71, 224.59);
      Diagrams.drawHouseholdDebtCrisisDiagram(ctx, t, 335.95, 361.60);
      Diagrams.drawMissingFactoryDiagram(ctx, t, 365.03, 405.48);
      Diagrams.drawDemographicClockDiagram(ctx, t, 500.18, 525.70);
      Diagrams.drawFourPillarsBlueprintDiagram(ctx, t, 532.37, 572.61);
    }

    // 5.1 BESPOKE FORENSIC MOTION GRAPHICS HUD OVERLAYS (ZERO BARE SLIDES)
    if (window.ForensicOverlays && ForensicOverlays.drawOverlay) {
      ForensicOverlays.drawOverlay(ctx, t);
    }

    // 6. DYNAMIC KARAOKE CAPTIONS (WORD-CLOCK SYNCED TO HINDI VO)
    if (window.Motion && Motion.drawDynamicCaption && window.CAPTIONS_DATA) {
      Motion.drawDynamicCaption(ctx, t, window.CAPTIONS_DATA, 960, 965);
    }
  }

  // Animation Loop for live playback (Strictly locked to masterAudio hardware clock)
  function loop(now) {
    if (isPlaying) {
      if (!masterAudio.paused && !masterAudio.seeking && !isSeekingAudio) {
        if (Math.abs(masterAudio.currentTime - currentTime) < 2.0) {
          currentTime = masterAudio.currentTime;
        } else {
          const dt = (now - lastTimestamp) / 1000;
          currentTime += dt;
        }
      } else {
        const dt = (now - lastTimestamp) / 1000;
        currentTime += dt;
      }
      if (currentTime >= TOTAL_DURATION) {
        currentTime = TOTAL_DURATION;
        isPlaying = false;
        btnPlay.textContent = '▶ PLAY';
        masterAudio.pause();
      }
      scrubber.value = currentTime;
      timeDisplay.textContent = `${formatTime(currentTime)} / 10:08`;
      render(currentTime);
      lastTimestamp = now;
      animFrameId = requestAnimationFrame(loop);
    }
  }

  // Play/Pause
  btnPlay.addEventListener('click', () => {
    if (!isPlaying) {
      isPlaying = true;
      btnPlay.textContent = '⏸ PAUSE';
      lastTimestamp = performance.now();
      masterAudio.currentTime = currentTime;
      masterAudio.play().catch(e => console.log('Audio autoplay prevented'));
      animFrameId = requestAnimationFrame(loop);
    } else {
      isPlaying = false;
      btnPlay.textContent = '▶ PLAY';
      masterAudio.pause();
      if (animFrameId) cancelAnimationFrame(animFrameId);
    }
  });

  // Restart
  btnRestart.addEventListener('click', () => {
    window.seek(0);
  });

  // Chapter jumps (Matching exact narrative sentence timestamps)
  document.getElementById('btn-ch1').addEventListener('click', () => window.seek(0));
  document.getElementById('btn-ch2').addEventListener('click', () => window.seek(83.45));
  document.getElementById('btn-ch3').addEventListener('click', () => window.seek(173.16));
  document.getElementById('btn-ch4').addEventListener('click', () => window.seek(276.75));
  document.getElementById('btn-ch5').addEventListener('click', () => window.seek(361.60));
  document.getElementById('btn-ch6').addEventListener('click', () => window.seek(457.45));
  document.getElementById('btn-ch7').addEventListener('click', () => window.seek(525.70));

  // Scrubber user interaction
  scrubber.addEventListener('input', (e) => {
    window.seek(parseFloat(e.target.value));
  });

  // Sync with audio if user unpauses native audio
  masterAudio.addEventListener('play', () => {
    if (!isPlaying) {
      isPlaying = true;
      btnPlay.textContent = '⏸ PAUSE';
      lastTimestamp = performance.now();
      animFrameId = requestAnimationFrame(loop);
    }
  });
  masterAudio.addEventListener('pause', () => {
    if (isPlaying) {
      isPlaying = false;
      btnPlay.textContent = '▶ PLAY';
      if (animFrameId) cancelAnimationFrame(animFrameId);
    }
  });

  // Check URL query parameters for render mode (?render=1)
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('render') === '1') {
    document.body.classList.add('render-mode');
  }

  // Initial draw at t=0 immediately and on load
  window.seek(0);
  window.addEventListener('load', () => {
    window.seek(0);
  });
  </script>
</body>
</html>
