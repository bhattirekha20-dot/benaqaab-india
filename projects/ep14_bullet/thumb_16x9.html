<!doctype html>
<!-- Ep14 thumbnail · 1280×720 · PLATFORM 508 look -->
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: Anton; src: url('../../brand/fonts/Anton.ttf'); }
  @font-face { font-family: Gro; src: url('../../brand/fonts/SpaceGrotesk.ttf'); font-weight: 300 700; }
  @font-face { font-family: JBM; src: url('../../brand/fonts/JetBrainsMono.ttf'); font-weight: 100 800; }
  *{box-sizing:border-box} html,body{margin:0;background:#000}
  #t{position:relative;width:1280px;height:720px;overflow:hidden;font-family:Gro;
     background:radial-gradient(120% 120% at 82% 6%,#20282d 0%,#121820 44%,#06080a 100%)}
  .mono{font-family:JBM;font-weight:700;letter-spacing:2px;text-transform:uppercase}
  .abs{position:absolute}
  #kicker{left:52px;top:44px;font-size:19px;color:#c9f24d}
  #h1{left:46px;top:92px;font-family:Anton;font-size:108px;line-height:.94;color:#f2f5ee}
  #h2{left:50px;top:232px;font-family:Anton;font-size:108px;line-height:.94;color:#c9f24d}
  #sub{left:54px;top:376px;font-size:27px;color:#cfd6cd;font-weight:500}
  #row{left:54px;top:444px;display:flex;gap:14px}
  .chip{font-family:JBM;font-weight:700;font-size:20px;letter-spacing:1.4px;padding:10px 16px 9px;border-radius:8px}
  .c1{background:#c9f24d;color:#161a05} .c2{background:rgba(255,255,255,.10);color:#f2f5ee;border:1px solid rgba(255,255,255,.22)}
  #foot{left:54px;bottom:32px;font-size:17px;color:#94a3a8}
  .stn{position:absolute;width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.4)}
  .stn.on{background:#c9f24d;box-shadow:0 0 12px rgba(201,242,77,.7)}
  .sl{position:absolute;font-family:JBM;font-weight:700;font-size:13px;color:#94a3a8}
  #trl{position:absolute;left:600px;top:300px;width:620px;height:4px;background:rgba(255,255,255,.22)}
  #trh{position:absolute;left:600px;top:300px;width:120px;height:4px;background:#c9f24d}
</style></head>
<body><div id="t">
  <div class="mono abs" id="kicker">EP 14 · BULLET TRAIN · 3 OCT 2026</div>
  <div class="abs" id="h1">BULLET TRAIN</div>
  <div class="abs" id="h2">2027</div>
  <div class="abs" id="sub">Pehla hissa: Surat → Bilimora, sirf 50 km.</div>
  <div class="abs" id="row"><span class="chip c1">POORA RASTA 508 KM</span><span class="chip c2">320 km/h · 12 STATIONS</span></div>
  <div class="mono abs" style="left:56px;top:562px;font-size:22px;color:#94a3b8">MUMBAI (BKC) → AHMEDABAD · SAFAR 2 GHANTE 07 MINUTE</div>
  <div class="mono abs" id="foot">BENAQAB INDIA · SOURCES ON SCREEN</div>
  <div id="trl"></div><div id="trh"></div>
  <div id="dots"></div>
  <div class="abs" style="right:56px;top:96px;text-align:right">
    <div style="font-family:Anton;font-size:76px;color:#f2f5ee;line-height:1">508 km</div>
    <div class="mono" style="font-size:16px;color:#94a3a8;margin-top:6px">12 STATIONS · ~80% DONE</div>
    <div style="font-family:Gro;font-weight:700;font-size:30px;color:#ffd9a0;margin-top:26px">21 km tunnel</div>
    <div class="mono" style="font-size:16px;color:#94a3a8;margin-top:4px">7 KM OF IT UNDER THE SEA</div>
  </div>
</div>
<script>
const S=['BKC','THANE','VIRAR','BOISAR','VAPI','BILIMORA','SURAT','BHARUCH','VADODARA','ANAND','AHMEDABAD','SABARMATI'];
const wrap=document.getElementById('dots'); let h='';
S.forEach((s,i)=>{ const x=600+i*(620/11); const on=(i===5||i===6);
  h+=`<div class="stn${on?' on':''}" style="left:${(x-8).toFixed(1)}px;top:292px"></div>`;
  const lab=((i%2===0)&&i!==4)||on; if(lab){ const dy=(i===5)?26:0;
    h+=`<div class="sl" style="left:${(x-26).toFixed(1)}px;top:${322+dy}px;width:120px;text-align:center">${s}</div>`; } });
wrap.innerHTML=h;
window.seek=()=>{}; window.ready=true; window.DURATION=1; window.FPS=30; window.WIDTH=1280; window.HEIGHT=720;
</script></body></html>
