// 1. Draw Callout Pin with Spring Leader Line
function drawCalloutPin(x, y, label, targetX, targetY, progress, color = "#38BDF8") {
  const p = Math.max(0, Math.min(1, progress * 1.6));
  if (p <= 0) return;
  
  ctx.save();
  // Target reticle
  ctx.beginPath();
  ctx.arc(targetX, targetY, 12, 0, Math.PI * 2);
  ctx.strokeStyle = color;
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.arc(targetX, targetY, 4, 0, Math.PI * 2);
  ctx.fillStyle = "#FFFFFF";
  ctx.fill();

  // Pulsing ring

  ctx.beginPath();
  ctx.arc(targetX, targetY, pulseR, 0, Math.PI * 2);
  ctx.strokeStyle = color;
  ctx.lineWidth = 2 * (1 - p);
  ctx.stroke();

  // Elbow line
  const midX = (targetX + x) / 2;
  ctx.beginPath();
  ctx.moveTo(targetX, targetY);
  ctx.lineTo(midX, y);
  ctx.lineTo(x, y);
  ctx.strokeStyle = color;
  ctx.lineWidth = 3;
  ctx.setLineDash([8, 4]);
  ctx.stroke();
  ctx.setLineDash([]);

  // Frosted Callout Pill with accurate dynamic text width

  const textWidth = ctx.measureText(label).width;
  const pillW = textWidth + 36;

  ctx.beginPath();

  ctx.fillStyle = "rgba(10, 14, 23, 0.95)";
  ctx.fill();
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.fillStyle = "#FFFFFF";
  ctx.textAlign = "left";
  ctx.fillText(label, x + 8, y + 5);
  ctx.restore();
}

  const p = Math.max(0, Math.min(1, progress * 1.5));
  if (p <= 0) return;
  
  ctx.save();
  ctx.strokeStyle = '#EF4444';
  ctx.lineWidth = 5;
  ctx.shadowColor = 'rgba(239, 68, 68, 0.6)';
  ctx.shadowBlur = 12;

  const currentX2 = x1 + (x2 - x1) * p;
  const currentY2 = y1 + (y2 - y1) * p;
  const midX = (x1 + currentX2) / 2;
  const sag = (1 - tension) * 50;
  const midY = (y1 + currentY2) / 2 + sag;

  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.quadraticCurveTo(midX, midY, currentX2, currentY2);
  ctx.stroke();

  // Red Pins at endpoints
  [[x1, y1], [currentX2, currentY2]].forEach(([px, py]) => {
    ctx.beginPath();
    ctx.arc(px, py, 10, 0, Math.PI * 2);
    ctx.fillStyle = '#DC2626';
    ctx.fill();
    ctx.strokeStyle = '#FFFFFF';
    ctx.lineWidth = 3;
    ctx.stroke();
  });
  ctx.restore();
}

  ctx.font = "700 20px 'JetBrains Mono', monospace";
  ctx.fillStyle = "#94A3B8";
  ctx.textAlign = "right";
  ctx.fillText("Just now", x + width - 35, y + 42);

  // SMS Text
  ctx.font = "600 26px 'Inter', sans-serif";
  ctx.fillStyle = "#FFFFFF";
  ctx.textAlign = "left";

  ctx.fillText("via AePS CW at CSP_MOHALI_49. Avl Bal: Rs 420.50.", x + 35, y + 130);
  
  ctx.font = "700 22px 'Space Grotesk', sans-serif";

}

// --- RENDER ENGINE ---
function renderFrame(t) {
  const beat = getActiveBeat(t);
  const beatDuration = beat.end - beat.start;
  const progress = Math.max(0, Math.min(1, (t - beat.start) / beatDuration));

  ctx.save();
  ctx.clearRect(0, 0, 1080, 1920);

  // 1. Camera Transform Matrix
  let scale = 1.0;
  let tx = 0;
  let ty = 0;

  if (beat.motion === "shake") {
    const shakeFreq = 40;
    const decay = Math.exp(-progress * 4.0);
    tx = Math.sin(progress * shakeFreq) * 24 * decay;
    ty = Math.cos(progress * shakeFreq * 1.3) * 18 * decay;
  } else if (beat.motion === "zoom_in") {
    scale = 1.0 + (progress * 0.08);
  } else if (beat.motion === "zoom_out") {
    scale = 1.08 - (progress * 0.08);
  } else if (beat.motion === "pan_down") {
    ty = -progress * 45;
    scale = 1.02;
  } else if (beat.motion === "pan_up") {
    ty = progress * 45;
    scale = 1.02;
  } else if (beat.motion === "pan_left") {
    tx = -progress * 45;
    scale = 1.02;
  } else if (beat.motion === "pan_right") {
    tx = progress * 45;
    scale = 1.02;
  }

  // Apply Virtual Camera
  ctx.translate(540 + tx, 960 + ty);
  ctx.scale(scale, scale);
  ctx.translate(-540, -960);

  // 2. Draw Background Base Visual Image
  const img = beatImages[beat.id];
  if (img && img.complete) {
    ctx.drawImage(img, 0, 0, 1080, 1920);
  } else {
    ctx.fillStyle = "#07090E";
    ctx.fillRect(0, 0, 1080, 1920);
  }

  // 3. Dynamic Forensic Motion Graphic Primitives Per Beat

  // Beat 1: Banking SMS Notification Slide-Down + Vibration
  if (beat.id === 1) {
    drawSMSNotification(80, 420, 920, 220, progress);
  }

  // Beat 2: Diagonal Red Cancellation Strike on Real RuPay Card
  if (beat.id === 2) {
    const strikeP = Math.min(1.0, progress * 2.0);
    ctx.save();
    ctx.strokeStyle = "#EF4444";
    ctx.lineWidth = 14;
    ctx.shadowColor = "#EF4444";
    ctx.shadowBlur = 18;
    ctx.beginPath();
    ctx.moveTo(320, 750);
    ctx.lineTo(320 + (440 * strikeP), 750 + (440 * strikeP));
    ctx.stroke();
    drawCalloutPin(100, 320, "ZERO CARD SWIPED • NO PHYSICAL CARD", 480, 880, progress, "#EF4444");
    ctx.restore();
  }

  // Beat 3: Cash Heist Alert
  if (beat.id === 3) {
    ctx.save();
    ctx.fillStyle = "rgba(239, 68, 68, 0.95)";
    ctx.beginPath();
    ctx.roundRect(100, 320, 880, 84, 20);
    ctx.fill();
    ctx.strokeStyle = "#FFFFFF";
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.font = "900 32px 'Anton', sans-serif";
    ctx.fillStyle = "#FFFFFF";
    ctx.textAlign = "center";
    ctx.fillText("IMMEDIATE CASH SIPHONED: -₹10,000", 540, 375);
    ctx.restore();
  }

  // Beat 5 & 12: Forensic Loupe 2.5X Magnification
  if (beat.id === 5 || beat.id === 12) {
    const loupeProgress = Math.min(1.0, progress * 1.5);
    const loupeRadius = 210 * loupeProgress;
    const lcx = 540;
    const lcy = 940;

    if (loupeRadius > 20) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(lcx, lcy, loupeRadius, 0, Math.PI * 2);
      ctx.clip();
      // Zoomed content inside loupe (2.5x)
      ctx.translate(lcx, lcy);
      ctx.scale(2.4, 2.4);
      ctx.translate(-lcx, -lcy);
      if (img && img.complete) ctx.drawImage(img, 0, 0, 1080, 1920);
      ctx.restore();

      // Specular Chrome Glass Border
      ctx.save();
      ctx.beginPath();
      ctx.arc(lcx, lcy, loupeRadius, 0, Math.PI * 2);
      ctx.lineWidth = 12;
      ctx.strokeStyle = "#38BDF8";
      ctx.shadowColor = "rgba(56, 189, 248, 0.8)";
      ctx.shadowBlur = 24;
      ctx.stroke();

      // Crosshair Reticle
      ctx.beginPath();
      ctx.moveTo(lcx - loupeRadius - 25, lcy); ctx.lineTo(lcx + loupeRadius + 25, lcy);
      ctx.moveTo(lcx, lcy - loupeRadius - 25); ctx.lineTo(lcx, lcy + loupeRadius + 25);
      ctx.strokeStyle = "rgba(56, 189, 248, 0.7)";
      ctx.lineWidth = 2.5;
      ctx.stroke();

      // HUD Tag Pill on Loupe (Opaque background)
      ctx.beginPath();
      ctx.roundRect(lcx + 50, lcy - loupeRadius - 12, 220, 44, 8);
      ctx.fillStyle = "rgba(10, 14, 23, 0.98)";
      ctx.fill();
      ctx.strokeStyle = "#38BDF8";
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.font = "800 18px 'JetBrains Mono', monospace";
      ctx.fillStyle = "#38BDF8";
      ctx.textAlign = "center";
      ctx.fillText(beat.id === 5 ? "SILICONE CLONE 2.5X" : "UNMASKED SCAN 2.5X", lcx + 160, lcy - loupeRadius + 17);
      ctx.restore();
    }
  }

  // Beat 6: Red Evidence String connecting nodes
  if (beat.id === 6) {
    drawEvidenceString(180, 800, 880, 1140, progress, 0.9);
    drawCalloutPin(100, 320, "ALIGARH CYBER POLICE SEIZURE", 540, 960, progress, "#EF4444");
  }

  // Beat 7: AePS Architecture Callout Pins
  if (beat.id === 7) {
    drawCalloutPin(100, 320, "CUSTOMER AADHAAR DATA ENTRY", 300, 780, progress, "#38BDF8");
    drawCalloutPin(500, 1450, "NPCI SWITCH CENTRAL HUB", 540, 980, progress, "#34D399");
  }

  // Beat 10 & 14: Jamabandi Public Portal Callout (Targeting the Red Download Button)
  if (beat.id === 10 || beat.id === 14) {
    drawCalloutPin(100, 320, "PUBLIC SALE DEED REPOSITORY", 790, 850, progress, "#FBBF24");
  }

  // Beat 13: Yellow Forensic Highlighter sweeping across Aadhaar number
  if (beat.id === 13) {
    drawYellowHighlighter(180, 860, 720, 90, progress);
    drawCalloutPin(100, 320, "AADHAAR NUMBER PUBLICLY EXPOSED", 420, 900, progress, "#EF4444");
  }

  // Beat 15: Butter Paper Tracing Callout
  if (beat.id === 15) {
    drawCalloutPin(100, 320, "TRACING RIDGES ONTO BUTTER PAPER", 480, 880, progress, "#FBBF24");
  }

  // Beat 16: Pulsating UV Curing Machine Glow
  if (beat.id === 16) {
    const pulse = 0.5 + 0.5 * Math.sin(progress * Math.PI * 6);
    ctx.save();
    ctx.fillStyle = `rgba(168, 85, 247, ${0.15 + pulse * 0.25})`;
    ctx.fillRect(80, 780, 920, 440);
    drawCalloutPin(100, 320, "UV LIGHT SOLIDIFIES POLYMER MOULD", 540, 880, progress, "#EC4899");
    ctx.restore();
  }

  // Beat 19: Biometric Laser Scanner Beam on Mantra MFS100 Station
  if (beat.id === 19) {
    drawLaserScanBeam(540, 780, 200, 180, progress);
    drawCalloutPin(100, 320, "OLDER L0 OPTICAL SCANNER (NO LIVENESS)", 600, 860, progress, "#22C55E");
  }

  // Beat 21: Live Monospace Odometer Roll (₹10,000)
  if (beat.id === 21) {
    const easeOut = 1 - Math.pow(1 - progress, 3);
    const amount = Math.floor(easeOut * 10000);
    ctx.save();
    ctx.fillStyle = "rgba(7, 9, 14, 0.94)";
    ctx.roundRect(80, 680, 920, 240, 24);
    ctx.fill();
    ctx.strokeStyle = "#EF4444";
    ctx.lineWidth = 5;
    ctx.shadowColor = "#EF4444";
    ctx.shadowBlur = 25;
    ctx.stroke();

    ctx.font = "900 92px 'JetBrains Mono', monospace";
    ctx.fillStyle = "#EF4444";
    ctx.textAlign = "center";
    ctx.fillText(`- ₹ ${amount.toLocaleString('en-IN')}`, 540, 835);

    ctx.font = "800 32px 'Space Grotesk', sans-serif";
    ctx.fillStyle = "#FBBF24";
    ctx.fillText("WITHDRAWN VIA ROGUE AePS MITRA", 540, 890);
    ctx.restore();
  }

  // Beat 22: Cyber Shield Expansion Pulse
  if (beat.id === 22) {
    const ringP = (progress * 2.5) % 1.0;
    ctx.save();
    ctx.beginPath();
    ctx.arc(540, 900, 160 + ringP * 140, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(56, 189, 248, ${1.0 - ringP})`;
    ctx.lineWidth = 4;
    ctx.stroke();
    drawCalloutPin(100, 320, "ACTIVATE CITIZEN PROTECTION SHIELD", 540, 880, progress, "#38BDF8");
    ctx.restore();
  }

  // Beat 24: Interactive Animated Biometric Lock Touch on Phone Screen
  if (beat.id === 24) {
    const touchP = Math.min(1.0, progress * 2.2);
    ctx.save();
    // Green Touch Ripple on Toggle Switch
    const rippleR = 25 + (touchP * 55);
    ctx.beginPath();
    ctx.arc(710, 1280, rippleR, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(52, 211, 153, ${1.0 - touchP})`;
    ctx.lineWidth = 5;
    ctx.stroke();

    drawCalloutPin(100, 320, "TAP TO LOCK BIOMETRICS IN mAadhaar", 710, 1280, progress, "#34D399");
    ctx.restore();
  }

  // Beat 26: Scammer Rejection at Mantra Station
  if (beat.id === 26) {
    drawCalloutPin(100, 320, "REJECTED • BIOMETRICS LOCKED BY USER", 600, 860, progress, "#EF4444");
  }

  // Beat 28: National Helpline 1930 Callout
  if (beat.id === 28) {
    drawCalloutPin(100, 320, "EMERGENCY SPEED DIAL (24x7)", 480, 680, progress, "#FBBF24");
  }

  // Beat 27: Slamming Red Decline Stamp onto Thermal POS Slip
  if (beat.id === 27) {
    const stampSettle = Math.min(1.0, progress * 4.0);
    const springScale = 2.4 - (stampSettle * 1.4);
    ctx.save();
    ctx.translate(540, 1180);
    ctx.rotate(-0.10);
    ctx.scale(springScale, springScale);
    ctx.globalAlpha = stampSettle;

    ctx.lineWidth = 8;
    ctx.strokeStyle = "#EF4444";
    ctx.shadowColor = "#EF4444";
    ctx.shadowBlur = 24;
    ctx.strokeRect(-340, -65, 680, 130);
    ctx.lineWidth = 3;
    ctx.strokeRect(-330, -55, 660, 110);

    ctx.font = "900 58px 'Anton', sans-serif";
    ctx.fillStyle = "#EF4444";
    ctx.textAlign = "center";
    ctx.fillText("DECLINED: ERROR 330", 0, 20);
    ctx.restore();
  }

  // Beat 29: Slamming Distressed Red Verdict Stamp
  if (beat.id === 29) {
    const stampSettle = Math.min(1.0, progress * 4.0);
    const springScale = 2.4 - (stampSettle * 1.4);
    const stampAlpha = stampSettle;

    ctx.save();
    ctx.translate(540, 1140);
    ctx.rotate(-0.14); // -8 degrees
    ctx.scale(springScale, springScale);
    ctx.globalAlpha = stampAlpha;

    ctx.lineWidth = 10;
    ctx.strokeStyle = "#EF4444";
    ctx.shadowColor = "rgba(239, 68, 68, 0.8)";
    ctx.shadowBlur = 25;
    ctx.strokeRect(-380, -80, 760, 160);

    ctx.lineWidth = 3;
    ctx.strokeRect(-370, -70, 740, 140);

    ctx.font = "900 72px 'Anton', sans-serif";
    ctx.fillStyle = "#EF4444";
    ctx.textAlign = "center";
    ctx.fillText("CLONED SCAM EXPOSED", 0, 26);
    ctx.restore();
  }

  // Beat 30: Channel Identity, Like & Subscribe Micro-Interactions
  if (beat.id === 30) {
    const ctaProgress = Math.min(1.0, progress * 2.0);
    ctx.save();
    ctx.globalAlpha = ctaProgress;
    
    // Central frosted glass card
    ctx.beginPath();
    ctx.roundRect(100, 700, 880, 580, 32);
    ctx.fillStyle = "rgba(10, 14, 23, 0.95)";
    ctx.fill();
    ctx.lineWidth = 3.5;
    ctx.strokeStyle = "#FBBF24";
    ctx.shadowColor = "rgba(251, 191, 36, 0.45)";
    ctx.shadowBlur = 28;
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Center Circular Avatar
    ctx.save();
    ctx.beginPath();
    ctx.arc(540, 840, 65, 0, Math.PI * 2);
    ctx.clip();
    if (logoImg.complete && logoImg.naturalWidth > 0) {
      ctx.drawImage(logoImg, 475, 775, 130, 130);
    } else {
      ctx.fillStyle = "#EF4444";
      ctx.fill();
    }
    ctx.restore();

    ctx.beginPath();
    ctx.arc(540, 840, 65, 0, Math.PI * 2);
    ctx.lineWidth = 4;
    ctx.strokeStyle = "#FBBF24";
    ctx.stroke();

    // Channel name & tagline
    ctx.font = "900 52px 'Anton', sans-serif";
    ctx.fillStyle = "#FFFFFF";
    ctx.textAlign = "center";
    ctx.fillText("BENAQAAB INDIA", 540, 955);

    ctx.font = "800 22px 'JetBrains Mono', monospace";
    ctx.fillStyle = "#FBBF24";
    ctx.fillText("SACH  •  SABOOT  •  BEBAK", 540, 1000);

    // Like Button
    ctx.beginPath();
    ctx.roundRect(160, 1050, 340, 90, 24);
    ctx.fillStyle = progress > 0.35 ? "rgba(56, 189, 248, 0.35)" : "rgba(255, 255, 255, 0.08)";
    ctx.fill();
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = "#38BDF8";
    ctx.stroke();

    ctx.font = "900 32px 'Anton', sans-serif";
    ctx.fillStyle = "#38BDF8";
    ctx.fillText(progress > 0.35 ? "👍 LIKED" : "👍 LIKE", 330, 1108);

    // Subscribe Button
    ctx.beginPath();
    ctx.roundRect(540, 1050, 380, 90, 24);
    ctx.fillStyle = progress > 0.6 ? "rgba(251, 191, 36, 0.3)" : "rgba(239, 68, 68, 0.85)";
    ctx.fill();
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = progress > 0.6 ? "#FBBF24" : "#EF4444";
    ctx.stroke();

    ctx.font = "900 32px 'Anton', sans-serif";
    ctx.fillStyle = progress > 0.6 ? "#FBBF24" : "#FFFFFF";
    ctx.fillText(progress > 0.6 ? "🔔 SUBSCRIBED" : "SUBSCRIBE ▶", 730, 1108);

    ctx.font = "700 22px 'Space Grotesk', sans-serif";
    ctx.fillStyle = "#94A3B8";
    ctx.fillText("SHARE THIS VIDEO TO PROTECT YOUR FAMILY", 540, 1210);
    ctx.restore();
  }

  // 4. Reset Camera for HUD Overlay (Fixed Safe Zones)
  ctx.restore();

  // Draw Top-Left Sleek Capsule Brand Pill
  ctx.save();
  ctx.beginPath();
  ctx.roundRect(60, 90, 380, 74, 37);
  ctx.fillStyle = "rgba(10, 14, 23, 0.92)";
  ctx.fill();
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = "#FBBF24";
  ctx.stroke();

  // Logo circle
  if (logoImg.complete && logoImg.naturalWidth > 0) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(97, 127, 27, 0, Math.PI * 2);
    ctx.clip();
    ctx.drawImage(logoImg, 70, 100, 54, 54);
    ctx.restore();
  } else {
    ctx.beginPath();
    ctx.arc(97, 127, 27, 0, Math.PI * 2);
    ctx.fillStyle = "#EF4444";
    ctx.fill();
  }

  // Brand text
  ctx.font = "900 26px 'Anton', sans-serif";
  ctx.fillStyle = "#FFFFFF";
  ctx.textAlign = "left";
  ctx.fillText("BENAQAAB INDIA", 136, 126);
  ctx.font = "800 13px 'JetBrains Mono', monospace";
  ctx.fillStyle = "#FBBF24";
  ctx.fillText("SACH · SABOOT · BEBAK", 138, 148);
  ctx.restore();

  // 5. High-Impact Caption Pill (Lower-Third Safe Zone, y = 1580)
  ctx.save();
  const cap = beat.caption;
  ctx.textAlign = "center";

  // Pill Background
  ctx.beginPath();
  ctx.roundRect(80, 1580, 920, 175, 26);
  ctx.fillStyle = "rgba(7, 9, 14, 0.94)";
  ctx.fill();
  ctx.lineWidth = 3.5;
  ctx.strokeStyle = beat.color || "#FBBF24";
  ctx.shadowColor = beat.color || "#FBBF24";
  ctx.shadowBlur = 15;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Text Line 1
  ctx.font = "900 56px 'Anton', sans-serif";
  ctx.fillStyle = "#FFFFFF";
  ctx.fillText(cap[0], 540, 1650);

  // Text Line 2 (Vibrant Accent with Kinetic Spring Pop)
  const popP = Math.min(1.0, progress * 4.0);
  const scalePop = 1.0 + (1.0 - popP) * 0.14;
  ctx.save();
  ctx.translate(540, 1722);
  ctx.scale(scalePop, scalePop);
  ctx.font = "900 50px 'Anton', sans-serif";
  ctx.fillStyle = beat.color || "#FBBF24";
  ctx.shadowColor = beat.color || "#FBBF24";
  ctx.shadowBlur = 14 * (1.0 - popP * 0.4);
  ctx.fillText(cap[1], 0, 0);
  ctx.restore();
  ctx.restore();

  // Subtle Living Texture (Micro Scanlines at 1.5% opacity)
  ctx.save();
  ctx.fillStyle = "rgba(255, 255, 255, 0.015)";
  for (let y = 0; y < 1920; y += 8) {
    ctx.fillRect(0, y, 1080, 2);
  }
  ctx.restore();
}

// --- ANIMATION RAF LOOP ---
function play() {
  if (currentTime >= TOTAL_DURATION) {
    seek(0);
  }
  isPlaying = true;
  playBtn.textContent = "⏸ PAUSE";
  playBtn.style.background = "linear-gradient(135deg, #eab308, #ca8a04)";
  audio.currentTime = currentTime;
  audio.play().catch(e => console.warn("Audio autoplay blocked:", e));
  lastRafTime = performance.now();
  requestAnimationFrame(rafLoop);
}

function pause() {
  isPlaying = false;
  playBtn.textContent = "▶ PLAY";
  playBtn.style.background = "linear-gradient(135deg, #ef4444, #dc2626)";
  audio.pause();
}

function togglePlay() {
  if (isPlaying) pause();
  else play();
}

function rafLoop(now) {
  if (!isPlaying) return;
  const dt = (now - lastRafTime) / 1000;
  lastRafTime = now;

  if (!audio.paused && audio.currentTime > 0) {
    currentTime = audio.currentTime;
  } else {
    currentTime += dt;
  }

  if (currentTime >= TOTAL_DURATION) {
    seek(TOTAL_DURATION);
    pause();
    return;
  }

  scrubber.value = currentTime;
  updateTimeUI(currentTime);
  renderFrame(currentTime);
  requestAnimationFrame(rafLoop);
}

// UI Event Handlers
playBtn.onclick = togglePlay;
resetBtn.onclick = () => { seek(0); play(); };

scrubber.oninput = (e) => {
  seek(parseFloat(e.target.value));
};

soundBtn.onclick = () => {
  audio.muted = !audio.muted;
  soundBtn.textContent = audio.muted ? "🔇 MUTED" : "🔊 AUDIO";
};

renderModeBtn.onclick = () => {
  document.body.classList.toggle("render-mode");
};

// Check query param ?render=1
if (new URLSearchParams(window.location.search).get("render") === "1") {
  document.body.classList.add("render-mode");
}

// Initial draw
seek(0);
</script>
