  height: 1920px !important;

<script>
// --- CORE TIMELINE & ASSETS DEFINITION ---
const TOTAL_DURATION = 47.304;
const NUM_BEATS = 30;

// Export composition properties on window for renderer contract
window.DURATION = TOTAL_DURATION;
window.FPS = 30;
window.WIDTH = 1080;
window.HEIGHT = 1920;

// Curated 30 Beats Data matching SCRIPT.md and scene_timeline.json with EXACT spoken audio timestamps
const BEATS = [
  { id: 1, start: 0.0, end: 1.85, spoken: "Aaj Delhi mein aisa kya hua...", caption: ["45 METRO", "GATES LOCKED!"], color: "#EF4444", motion: "barricade_sweep" },

  { id: 3, start: 3.90, end: 5.80, spoken: "...25,000 police tainaat hui...", caption: ["25,000 POLICE", "DEPLOYED!"], color: "#38BDF8", motion: "security_flash" },
  { id: 4, start: 5.80, end: 7.80, spoken: "...aur flight mein ghuskar arrest...", caption: ["IN-FLIGHT", "DRAMATIC ARREST!"], color: "#EF4444", motion: "target_lock" },
  { id: 5, start: 7.80, end: 10.00, spoken: "Is poore bawal ke peeche hai...", caption: ["WHO IS", "CJP?"], color: "#FBBF24", motion: "cinematic_reveal" },
  { id: 6, start: 10.00, end: 12.40, spoken: "...Cockroach Janta Party!...", caption: ["COCKROACH", "JANTA PARTY!"], color: "#FBBF24", motion: "emblem_glow" },
  { id: 7, start: 12.40, end: 14.10, spoken: "Naam ajeeb laga?...", caption: ["NAME SOUNDS", "STRANGE?"], color: "#38BDF8", motion: "question_pulse" },
  { id: 8, start: 14.10, end: 16.70, spoken: "Jab ek judge ne berozgaar...", caption: ["YOUTH CALLED", "'COCKROACHES'!"], color: "#EF4444", motion: "gavel_shake" },
  { id: 9, start: 16.70, end: 18.00, spoken: "...cockroach kaha...", caption: ["INSULT TURNED", "INTO WEAPON!"], color: "#FBBF24", motion: "highlighter_sweep" },
  { id: 10, start: 18.00, end: 21.00, spoken: "...youth ne isi naam ko...", caption: ["GEN Z", "ON STREETS!"], color: "#34D399", motion: "protest_march" },
  { id: 11, start: 21.00, end: 22.80, spoken: "Lekin aaj Jantar Mantar par...", caption: ["JANTAR MANTAR", "SURROUNDED!"], color: "#EF4444", motion: "cordon_lock" },
  { id: 12, start: 22.80, end: 24.50, spoken: "...inki maang kya thi?...", caption: ["DEMANDING", "RESIGNATION!"], color: "#FBBF24", motion: "banner_drop" },
  { id: 13, start: 24.50, end: 25.70, spoken: "Chief Election Commissioner...", caption: ["ELECTION COMMISSION", "HEADQUARTERS"], color: "#38BDF8", motion: "institution_pan" },
  { id: 14, start: 25.70, end: 27.20, spoken: "...Gyanesh Kumar ka isteefa!...", caption: ["CHIEF ELECTION", "COMMISSIONER"], color: "#FBBF24", motion: "loupe_zoom" },
  { id: 15, start: 27.20, end: 28.50, spoken: "Kyunki voter list se...", caption: ["SPECIAL INTENSIVE", "REVISION 2026"], color: "#38BDF8", motion: "gazette_reveal" },
  { id: 16, start: 28.50, end: 29.80, spoken: "...laakhon naujawaano ke...", caption: ["FORM 7", "VOTER PURGE!"], color: "#EF4444", motion: "form7_highlighter" },
  { id: 17, start: 29.80, end: 31.80, spoken: "...naam gayab kar diye gaye!...", caption: ["MILLIONS OF", "NAMES REMOVED!"], color: "#EF4444", motion: "odometer_3M" },
  { id: 18, start: 31.80, end: 33.10, spoken: "Founder Abhijeet Dipke ko...", caption: ["FOUNDER", "ABHIJEET DIPKE"], color: "#38BDF8", motion: "profile_card" },
  { id: 19, start: 33.10, end: 34.20, spoken: "...flight mein arrest kiya...", caption: ["DETAINED ON", "THE RUNWAY!"], color: "#EF4444", motion: "runway_arrest" },
  { id: 20, start: 34.20, end: 34.80, spoken: "...hirasat...", caption: ["3,000+ ACTIVISTS", "DETAINED!"], color: "#EF4444", motion: "siren_strobe" },
  { id: 21, start: 34.80, end: 35.60, spoken: "...trainein roki...", caption: ["TRAINS STOPPED", "OUTSIDE DELHI!"], color: "#FBBF24", motion: "railway_empty" },
  { id: 22, start: 35.60, end: 36.50, spoken: "...aur internet band!...", caption: ["MOBILE INTERNET", "SHUT DOWN!"], color: "#EF4444", motion: "telecom_no_signal" },
  { id: 23, start: 36.50, end: 37.45, spoken: "...fortress Delhi...", caption: ["FORTRESS DELHI", "4 CORDONS!"], color: "#38BDF8", motion: "satellite_cordons" },
  { id: 24, start: 37.45, end: 38.60, spoken: "Supreme Court ne aaj...", caption: ["SUPREME COURT", "HEARS PLEA!"], color: "#FBBF24", motion: "apex_court_dolly" },
  { id: 25, start: 38.60, end: 39.60, spoken: "...fatkaar lagayi:...", caption: ["BENCH GRILLS", "AUTHORITIES!"], color: "#38BDF8", motion: "courtroom_shake" },
  { id: 26, start: 39.60, end: 41.00, spoken: "...ek makkhi maarne ke liye...", caption: ["HAMMER TO", "KILL A FLY!"], color: "#EF4444", motion: "historic_quote" },
  { id: 27, start: 41.00, end: 42.40, spoken: "...hathouda nahi chalaya jaata!...", caption: ["DISPROPORTIONATE", "FORCE!"], color: "#EF4444", motion: "verdict_stamp" },
  { id: 28, start: 42.40, end: 43.60, spoken: "Sach, Saboot...", caption: ["FACTS FULLY", "VERIFIED!"], color: "#34D399", motion: "ledger_highlight" },
  { id: 29, start: 43.60, end: 44.80, spoken: "...Bebak...", caption: ["SACH · SABOOT", "BEBAK!"], color: "#FBBF24", motion: "brand_credo" },
  { id: 30, start: 44.80, end: 47.304, spoken: "Subscribe Benaqaab India!...", caption: ["SUBSCRIBE TO", "BENAQAAB INDIA!"], color: "#EF4444", motion: "subscribe_cta" }
];

// Active Beat Finder based on Exact Audio Timestamps
function getActiveBeatIndex(t) {
  for (let i = 0; i < BEATS.length; i++) {
    if (t >= BEATS[i].start && (t < BEATS[i].end || i === BEATS.length - 1)) {
      return i;
    }
  }
  return BEATS.length - 1;
}

// Preload Images
const images = [];
let loadedCount = 0;
for (let i = 1; i <= NUM_BEATS; i++) {
  const img = new Image();
  const padId = String(i).padStart(2, '0');
  img.src = `assets/visuals/beat_${padId}.jpg`;
  img.onload = () => {
    loadedCount++;
    if (loadedCount >= NUM_BEATS) {
      window.ready = true;
    }
  };
  images.push(img);
}

// Preload Brand Logo
const brandLogo = new Image();
brandLogo.src = 'assets/logo.png';

// Canvas Setup
const canvas = document.getElementById('videoCanvas');
const ctx = canvas.getContext('2d');
const W = 1080;
const H = 1920;

// Audio and Controls
const audio = document.getElementById('masterAudio');
const scrubber = document.getElementById('scrubber');
const playBtn = document.getElementById('playBtn');
const resetBtn = document.getElementById('resetBtn');
const soundBtn = document.getElementById('soundBtn');
const renderModeBtn = document.getElementById('renderModeBtn');
const timeDisplay = document.getElementById('timeDisplay');
const beatsContainer = document.getElementById('beatsContainer');

let isPlaying = false;
let currentTime = 0;
let lastAnimTime = 0;

// Check URL param ?render=1
if (new URLSearchParams(window.location.search).get('render') === '1') {
  document.body.classList.add('render-mode');
}

// Populate Beat Pills with Exact Timestamps
BEATS.forEach((b, idx) => {
  const pill = document.createElement('button');
  pill.className = 'beat-pill';
  pill.id = `pill-${idx}`;
  pill.innerText = `B${idx+1}`;
  pill.title = `${b.caption.join(' ')} (${b.start.toFixed(1)}s)`;
  pill.onclick = () => { seek(b.start); };
  beatsContainer.appendChild(pill);
});

// Deterministic Easing Functions
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function easeInOutQuad(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
function springSettle(t) {
  if (t >= 1) return 1;
  return 1 - Math.exp(-6 * t) * Math.cos(12 * t);
}

// --- DETERMINISTIC RENDER FUNCTION: seek(t) ---
window.seek = function(t) {
  currentTime = Math.max(0, Math.min(TOTAL_DURATION, t));
  scrubber.value = currentTime;
  updateTimeUI(currentTime);

  if (Math.abs(audio.currentTime - currentTime) > 0.08) {
    audio.currentTime = currentTime;
  }

  renderFrame(currentTime);
};

// Deterministic Ambient Micro-Particles
const NUM_PARTICLES = 40;
const particles = [];
for (let i = 0; i < NUM_PARTICLES; i++) {
  particles.push({
    baseX: (i * 37) % W,
    baseY: (i * 53) % H,
    speed: 0.15 + ((i * 13) % 20) / 40,
    radius: 1.2 + ((i * 7) % 15) / 6,
    alpha: 0.2 + ((i * 11) % 40) / 100
  });
}

function getCameraShake(beatIndex, localT) {
  const impactBeats = [0, 3, 7, 10, 18, 25, 26]; // 1, 4, 8, 11, 19, 26, 27
  if (!impactBeats.includes(beatIndex)) return { x: 0, y: 0, rot: 0 };
  if (localT > 0.38) return { x: 0, y: 0, rot: 0 };
  const decay = Math.pow(1 - (localT / 0.38), 2.2);
  const shakeAmp = 22 * decay;
  const freq = 50;
  return {
    x: Math.sin(localT * freq) * shakeAmp,
    y: Math.cos(localT * freq * 1.3) * shakeAmp * 0.7,
    rot: Math.sin(localT * freq * 0.8) * 0.018 * decay
  };
}

function renderFrame(t) {
  ctx.save();
  ctx.clearRect(0, 0, W, H);

  // Determine Active Beat Index from Exact Audio Timestamps
  const beatIndex = getActiveBeatIndex(t);
  const beat = BEATS[beatIndex];
  const localT = Math.max(0, Math.min(1.0, (t - beat.start) / (beat.end - beat.start))); // 0.0 to 1.0 within active beat

  // Highlight active pill
  document.querySelectorAll('.beat-pill').forEach((p, idx) => {
    p.classList.toggle('active', idx === beatIndex);
  });

  // Camera Shake & Virtual Camera Transformation
  const shake = getCameraShake(beatIndex, localT);
  const zoomProgress = easeInOutQuad(localT);
  const scale = 1.0 + 0.05 * Math.sin(zoomProgress * Math.PI); // breathing zoom
  const panY = -12 * Math.sin(localT * Math.PI);

  ctx.save();
  ctx.translate(W / 2 + shake.x, H / 2 + shake.y);
  ctx.rotate(shake.rot);
  ctx.scale(scale, scale);
  ctx.translate(-W / 2, -H / 2 + panY);

  // 1. DRAW CINEMATIC VISUAL BACKGROUND WITH FLUID CROSS-DISSOLVE
  const imgCurrent = images[beatIndex];
  const imgPrev = beatIndex > 0 ? images[beatIndex - 1] : null;
  const crossfadeDuration = 0.18; // 180ms smooth dissolve
  const isTransitioning = localT < crossfadeDuration && imgPrev && imgPrev.complete;

  if (isTransitioning) {
    // Draw previous beat image as base
    ctx.drawImage(imgPrev, 0, 0, W, H);
    // Crossfade current beat image on top
    const blendAlpha = easeOutCubic(localT / crossfadeDuration);
    ctx.save();
    ctx.globalAlpha = blendAlpha;
    if (imgCurrent && imgCurrent.complete) {
      ctx.drawImage(imgCurrent, 0, 0, W, H);
    }
    ctx.restore();
  } else if (imgCurrent && imgCurrent.complete) {
    ctx.drawImage(imgCurrent, 0, 0, W, H);
  } else {
    // Elegant chromatic fallback
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0a0e1a');
    grad.addColorStop(1, '#05070d');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  // 2. AMBIENT LIVING PARTICLES (Zero Dead Frames)
  ctx.save();
  particles.forEach(p => {
    const py = (p.baseY - (t * 40 * p.speed)) % H;
    const actualY = py < 0 ? py + H : py;
    const px = (p.baseX + Math.sin(t * 1.5 + p.baseX) * 15) % W;
    ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha * 0.5})`;
    ctx.beginPath();
    ctx.arc(px, actualY, p.radius, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.restore();

  // 3. SUBTLE SCANLINE OVERLAY
  ctx.fillStyle = 'rgba(0, 0, 0, 0.06)';
  for (let y = 0; y < H; y += 8) {
    ctx.fillRect(0, y, W, 2);
  }

  // 4. MOTION GRAPHIC PRIMITIVES PER BEAT (Highlighter, Real Loupe, Odometer, Stamp, Pins)
  drawBeatMotionGraphics(beatIndex, localT, imgCurrent);

  ctx.restore(); // Restore virtual camera context

  // 5. TOP BRANDING LOGO PILL (Screen space, top-left safe area)
  drawBrandLogoPill(t);

  // 6. TOP BREAKING RED TICKER (Screen space)
  drawTopBreakingTicker(t);

  // 7. VIRAL 2-WORD CAPTION PILLS (Screen space, y = 1650px)
  drawViralCaptionPills(beat.caption, beat.color, localT);

  // 8. BOTTOM LIVE AUDIO PROGRESS
  drawBottomProgress(t);

  ctx.restore();
}

// A. Brand Logo Pill (Top-Left Safe Area as per reference)
function drawBrandLogoPill(t) {
  const x = 40, y = 40, w = 224, h = 44, r = 22;
  
  ctx.save();
  ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
  ctx.shadowBlur = 14;
  ctx.shadowOffsetY = 4;

  // Dark frosted glass capsule
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  ctx.fillStyle = 'rgba(12, 17, 28, 0.88)';
  ctx.fill();

  // 1px Specular Border
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = 'rgba(251, 191, 36, 0.45)'; // Subtle gold accent border
  ctx.stroke();

  // Brand Avatar (Circular Left Clip)
  if (brandLogo && brandLogo.complete) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(x + 22, y + 22, 14, 0, Math.PI * 2);
    ctx.clip();
    ctx.drawImage(brandLogo, x + 8, y + 8, 28, 28);
    ctx.restore();

    // Subtle gold ring around avatar
    ctx.beginPath();
    ctx.arc(x + 22, y + 22, 14, 0, Math.PI * 2);
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = '#fbbf24';
    ctx.stroke();
  }

  // Single-Line Bold Typography: BENAQAAB INDIA
  ctx.fillStyle = '#ffffff';
  ctx.font = '800 14px "Inter", sans-serif';
  ctx.letterSpacing = '1px';
  ctx.fillText('BENAQAAB INDIA', x + 46, y + 27);

  ctx.restore();
}

// B. Top Breaking Ticker
function drawTopBreakingTicker(t) {
  const tickerY = 100;
  ctx.save();
  
  // Crimson Tag on Left
  ctx.fillStyle = '#ef4444';
  ctx.beginPath();
  ctx.roundRect(40, tickerY, 130, 26, 6);
  ctx.fill();

  ctx.fillStyle = '#ffffff';
  ctx.font = '800 11px "JetBrains Mono", monospace';
  ctx.fillText('🔴 LIVE UPDATE', 50, tickerY + 17);

  // Moving News Headline
  ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
  ctx.font = '700 12px "Inter", sans-serif';
  ctx.fillText('DELHI LOCKDOWN • 45 METRO STATIONS CLOSED • 25K POLICE AT JANTAR MANTAR', 184, tickerY + 17);

  ctx.restore();
}

// Helper: Animated Callout Pin with Leader Line
function drawCalloutPin(cx, cy, label, tag, color = '#38bdf8', localT) {
  const p = easeOutCubic(Math.min(1.0, localT * 2.2));
  if (p <= 0) return;
  ctx.save();
  // Target reticle
  ctx.beginPath();
  ctx.arc(cx, cy, 7, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx, cy, 14 + 4 * Math.sin(localT * 8), 0, Math.PI * 2);
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Leader line
  const elbowX = cx + 70 * p;
  const elbowY = cy - 50 * p;
  const endX = elbowX + 180 * p;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(elbowX, elbowY);
  ctx.lineTo(endX, elbowY);
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // Glass info card
  if (p > 0.5) {
    ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
    ctx.beginPath();
    ctx.roundRect(elbowX, elbowY - 48, 220, 44, 8);
    ctx.fill();
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.font = '800 14px "JetBrains Mono", monospace';
    ctx.fillText(label, elbowX + 12, elbowY - 26);
    ctx.fillStyle = color;
    ctx.font = '700 11px "Inter", sans-serif';
    ctx.fillText(tag, elbowX + 12, elbowY - 12);
  }
  ctx.restore();
}

// C. Motion Graphics Primitives per Beat
function drawBeatMotionGraphics(beatIndex, localT, currentImg) {
  ctx.save();

  // Beat 2: Callout Pin on Metro Map
  if (beatIndex === 1) {
    drawCalloutPin(540, 780, '45 METRO STATIONS', 'DMRC ADVISORY ENFORCED', '#fbbf24', localT);
  }

  // Beat 3: Callout Pin on Police Barricades
  if (beatIndex === 2) {
    drawCalloutPin(640, 860, '25,000 SECURITY', 'POLICE & RAF CORDONS', '#ef4444', localT);
  }

  // Beat 9: Yellow Highlighter Sweep on Legal Quote
  if (beatIndex === 8) {
    const sweepProgress = Math.min(1.0, localT * 1.5);
    const highlightW = (W - 220) * sweepProgress;
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = 'rgba(254, 240, 138, 0.85)';
    ctx.beginPath();
    ctx.roundRect(110, 720, highlightW, 110, 8);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }

  // Beat 14: REAL 2.2X Magnified Forensic Loupe on CEC Face
  if (beatIndex === 13) {
    const loupeSettle = easeOutCubic(Math.min(1.0, localT * 2.0));
    const cx = 540, cy = 920; // Direct center of CEC face on canvas
    const r = 150 * loupeSettle;

    ctx.save();
    // 1. Clip circle for magnified image
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.save();
    ctx.clip();

    // 2. Draw actual 2.2X magnified pixel crop with exact coordinate scaling
    if (currentImg && currentImg.complete) {
      const zoomFactor = 2.2;
      const imgScaleX = currentImg.naturalWidth / W;
      const imgScaleY = currentImg.naturalHeight / H;
      const srcX = cx * imgScaleX;
      const srcY = cy * imgScaleY;
      const cropW = (r * 2 * imgScaleX) / zoomFactor;
      const cropH = (r * 2 * imgScaleY) / zoomFactor;
      ctx.drawImage(currentImg, srcX - cropW/2, srcY - cropH/2, cropW, cropH, cx - r, cy - r, r * 2, r * 2);
    }

    // 3. Specular glass reflection
    const glassGrad = ctx.createLinearGradient(cx - r, cy - r, cx + r, cy + r);
    glassGrad.addColorStop(0, 'rgba(255, 255, 255, 0.28)');
    glassGrad.addColorStop(0.5, 'rgba(56, 189, 248, 0.05)');
    glassGrad.addColorStop(1, 'rgba(0, 0, 0, 0.2)');
    ctx.fillStyle = glassGrad;
    ctx.fill();
    ctx.restore(); // restore clip

    // 4. Specular outer bezel & cyan glow
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.lineWidth = 6;
    ctx.strokeStyle = '#38bdf8';
    ctx.shadowColor = '#38bdf8';
    ctx.shadowBlur = 20;
    ctx.stroke();

    // 5. Reticle crosshairs
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.7)';
    ctx.beginPath();
    ctx.moveTo(cx - r - 15, cy); ctx.lineTo(cx + r + 15, cy);
    ctx.moveTo(cx, cy - r - 15); ctx.lineTo(cx, cy + r + 15);
    ctx.stroke();

    // 6. Forensic badge tag
    ctx.fillStyle = '#0f172a';
    ctx.beginPath();
    ctx.roundRect(cx + r - 30, cy - r - 10, 140, 32, 6);
    ctx.fill();
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = '#38bdf8';
    ctx.font = '800 13px "JetBrains Mono", monospace';
    ctx.fillText('2.2X ZOOM', cx + r - 16, cy - r + 11);

    ctx.restore();
  }

  // Beat 15: Callout Pin on Gazette
  if (beatIndex === 14) {
    drawCalloutPin(480, 720, 'SIR 2026 GAZETTE', 'SPECIAL REVISION CLAUSE', '#38bdf8', localT);
  }

  // Beat 16: Yellow Highlighter Sweep on Form 7
  if (beatIndex === 15) {
    const sweepProgress = Math.min(1.0, localT * 1.6);
    const highlightW = 480 * sweepProgress;
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = 'rgba(254, 240, 138, 0.85)';
    ctx.beginPath();
    ctx.roundRect(160, 680, highlightW, 60, 6);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }

  // Beat 17: Live Rolling Odometer (0 -> 3,240,000)
  if (beatIndex === 16) {
    const rollProgress = easeOutCubic(Math.min(1.0, localT * 1.4));
    const currentCount = Math.floor(3240000 * rollProgress);
    const countFormatted = currentCount.toLocaleString('en-IN') + '+';

    ctx.save();
    // Frosted glass backing HUD container
    ctx.fillStyle = 'rgba(10, 15, 28, 0.9)';
    ctx.beginPath();
    ctx.roundRect(140, 720, 800, 150, 18);
    ctx.fill();
    ctx.strokeStyle = 'rgba(239, 68, 68, 0.5)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#ef4444';
    ctx.font = '900 84px "Anton", sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#ef4444';
    ctx.shadowBlur = 25;
    ctx.fillText(countFormatted, W / 2, 810);

    ctx.fillStyle = '#fef08a';
    ctx.font = '800 18px "JetBrains Mono", monospace';
    ctx.shadowBlur = 0;
    ctx.fillText('FORM 7 DELETIONS • ECI PORTAL', W / 2, 848);
    ctx.restore();
  }

  // Beat 23: Callout Pin on Satellite Map
  if (beatIndex === 22) {
    drawCalloutPin(540, 740, 'CORDON ZONE 1', 'SEC. 163 ENFORCED', '#ef4444', localT);
  }

  // Beat 26 & 27: Slamming Forensic Verdict Stamp
  if (beatIndex === 26) {
    const stampT = Math.min(1.0, localT * 2.2);
    const settle = springSettle(stampT);
    const stampScale = 1.6 - 0.6 * settle;
    const stampAlpha = Math.min(1.0, stampT * 3);

    ctx.save();
    ctx.translate(540, 780);
    ctx.rotate(-7 * Math.PI / 180);
    ctx.scale(stampScale, stampScale);
    ctx.globalAlpha = stampAlpha;

    ctx.lineWidth = 8;
    ctx.strokeStyle = '#ef4444';
    ctx.fillStyle = 'rgba(239, 68, 68, 0.2)';
    ctx.beginPath();
    ctx.roundRect(-420, -100, 840, 200, 24);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#ef4444';
    ctx.font = '900 64px "Anton", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('DISPROPORTIONATE FORCE!', 0, -10);

    ctx.fillStyle = '#fef08a';
    ctx.font = '800 26px "JetBrains Mono", monospace';
    ctx.fillText('CONFIRMED BY SUPREME COURT', 0, 50);

    ctx.restore();
  }

  // Beat 30: Interactive Subscribe, Like & Bell CTA Card (Rule 3.9)
  if (beatIndex === 29) {
    const ctaT = Math.min(1.0, localT * 1.8);
    const cardSettle = easeOutCubic(ctaT);
    const bellShake = Math.sin(localT * Math.PI * 10) * 12;

    ctx.save();
    ctx.translate(540, 860);
    ctx.scale(cardSettle, cardSettle);

    // Frosted Card Base
    ctx.fillStyle = 'rgba(15, 23, 42, 0.94)';
    ctx.beginPath();
    ctx.roundRect(-380, -220, 760, 440, 28);
    ctx.fill();
    ctx.strokeStyle = 'rgba(251, 191, 36, 0.4)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Brand Avatar
    if (brandLogo && brandLogo.complete) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(0, -120, 42, 0, Math.PI * 2);
      ctx.clip();
      ctx.drawImage(brandLogo, -42, -162, 84, 84);
      ctx.restore();
      ctx.beginPath();
      ctx.arc(0, -120, 42, 0, Math.PI * 2);
      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }

    // Channel Title & Tagline
    ctx.fillStyle = '#ffffff';
    ctx.font = '900 32px "Space Grotesk", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('BENAQAAB INDIA', 0, -48);

    ctx.fillStyle = '#fbbf24';
    ctx.font = '800 16px "JetBrains Mono", monospace';
    ctx.fillText('SACH · SABOOT · BEBAK', 0, -18);

    // Interactive Like Button
    ctx.fillStyle = 'rgba(56, 189, 248, 0.2)';
    ctx.beginPath();
    ctx.roundRect(-280, 30, 240, 64, 16);
    ctx.fill();
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.font = '800 20px "Inter", sans-serif';
    ctx.fillText('👍 LIKED', -160, 70);

    // Morphing Subscribe Button
    const isSubscribed = localT > 0.45;
    ctx.fillStyle = isSubscribed ? 'rgba(251, 191, 36, 0.2)' : '#dc2626';
    ctx.beginPath();
    ctx.roundRect(40, 30, 240, 64, 16);
    ctx.fill();
    ctx.strokeStyle = isSubscribed ? '#fbbf24' : '#ef4444';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.font = '800 20px "Inter", sans-serif';
    ctx.fillText(isSubscribed ? '🔔 SUBSCRIBED' : 'SUBSCRIBE ▶', 160, 70);

    // Floating Bell Icon on top
    ctx.save();
    ctx.translate(0, 150);
    ctx.rotate(bellShake * Math.PI / 180);
    ctx.font = '48px "Inter", sans-serif';
    ctx.fillText('🔔', 0, 0);
    ctx.restore();

    ctx.restore();
  }

  ctx.restore();
}

// D. Viral 2-Word Caption Pills (Lower Safe Area: y = 1640px)
function drawViralCaptionPills(captionWords, highlightColor, localT) {
  if (!captionWords || captionWords.length === 0) return;

  const pillY = 1650;
  const entryProgress = easeOutCubic(Math.min(1.0, localT * 3.5));
  const scale = 0.85 + 0.15 * entryProgress;

  ctx.save();
  ctx.translate(W / 2, pillY);
  ctx.scale(scale, scale);

  const line1 = captionWords[0] || "";
  const line2 = captionWords[1] || "";

  ctx.textAlign = 'center';

  // LINE 1 (Bold White with Heavy Black Outline)
  if (line1) {
    ctx.font = '900 76px "Anton", sans-serif';
    ctx.lineWidth = 14;
    ctx.strokeStyle = '#000000';
    ctx.strokeText(line1, 0, -45);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(line1, 0, -45);
  }

  // LINE 2 (Highlight Color with Glowing Shadow & Heavy Outline)
  if (line2) {
    ctx.font = '900 84px "Anton", sans-serif';
    ctx.shadowColor = highlightColor;
    ctx.shadowBlur = 25;
    ctx.lineWidth = 16;
    ctx.strokeStyle = '#000000';
    ctx.strokeText(line2, 0, 48);

    ctx.fillStyle = highlightColor;
    ctx.fillText(line2, 0, 48);
  }

  ctx.restore();
}

// E. Bottom Audio Progress Line
function drawBottomProgress(t) {
  const progress = t / TOTAL_DURATION;
  ctx.save();
  ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
  ctx.fillRect(0, H - 12, W, 12);

  const grad = ctx.createLinearGradient(0, 0, W * progress, 0);
  grad.addColorStop(0, '#ef4444');
  grad.addColorStop(0.5, '#fbbf24');
  grad.addColorStop(1, '#38bdf8');
  ctx.fillStyle = grad;
  ctx.fillRect(0, H - 12, W * progress, 12);
  ctx.restore();
}

// --- CONTROLS & INTERACTIVITY ---
function updateTimeUI(t) {
  const curM = Math.floor(t / 60);
  const curS = (t % 60).toFixed(1);
  const totM = Math.floor(TOTAL_DURATION / 60);
  const totS = (TOTAL_DURATION % 60).toFixed(1);
  timeDisplay.innerText = `${String(curM).padStart(2, '0')}:${String(curS).padStart(4, '0')} / ${String(totM).padStart(2, '0')}:${String(totS).padStart(4, '0')}`;
}

scrubber.addEventListener('input', (e) => {
  seek(parseFloat(e.target.value));
});

playBtn.addEventListener('click', () => {
  if (isPlaying) {
    pauseVideo();
  } else {
    playVideo();
  }
});

resetBtn.addEventListener('click', () => {
  seek(0);
  playVideo();
});

soundBtn.addEventListener('click', () => {
  audio.muted = !audio.muted;
  soundBtn.innerText = audio.muted ? '🔇 MUTED' : '🔊 AUDIO';
});

renderModeBtn.addEventListener('click', () => {
  document.body.classList.toggle('render-mode');
});

function playVideo() {
  isPlaying = true;
  playBtn.innerText = '⏸ PAUSE';
  if (currentTime >= TOTAL_DURATION - 0.1) {
    currentTime = 0;
    audio.currentTime = 0;
  }
  audio.play().catch(e => console.log('Audio autoplay prevented:', e));
  requestAnimationFrame(animLoop);
}

function pauseVideo() {
  isPlaying = false;
  playBtn.innerText = '▶ PLAY';
  audio.pause();
}

function animLoop() {
  if (!isPlaying) return;

  // Audio element is the absolute master clock: zero drift, 100% sync
  let newT = audio.currentTime;

  if (audio.paused || audio.ended || newT >= TOTAL_DURATION) {
    if (newT >= TOTAL_DURATION) {
      seek(TOTAL_DURATION);
    }
    pauseVideo();
    return;
  }

  currentTime = newT;
  scrubber.value = currentTime;
  updateTimeUI(currentTime);
  renderFrame(currentTime);

  requestAnimationFrame(animLoop);
}

// Initial Seek to 0 on Load
window.addEventListener('load', () => {
  seek(0);
});
</script>
