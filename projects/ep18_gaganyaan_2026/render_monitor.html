<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Benaqaab India — Live Render Telemetry</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 20%, #0d1527, #07090e 80%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .hud-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 20px;
      padding: 36px 44px;
      max-width: 840px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(56, 189, 248, 0.15);
      backdrop-filter: blur(16px);
    }
    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 16px;
    }
    .brand-title {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .pulse-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 12px #10b981;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .badge-gpu {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      font-family: monospace;
    }
    .progress-section {
      margin: 24px 0;
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 10px;
    }
    .percentage-big {
      font-size: 48px;
      font-weight: 900;
      font-family: "JetBrains Mono", monospace;
      color: #38bdf8;
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
    }
    .frames-count {
      font-size: 15px;
      color: #94a3b8;
      font-family: monospace;
    }
    .bar-container {
      width: 100%;
      height: 20px;
      background: rgba(2, 6, 23, 0.8);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0284c7, #38bdf8, #f59e0b);
      border-radius: 10px;
      transition: width 0.3s ease;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.8);
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 24px;
    }
    .stat-pill {
      background: rgba(10, 15, 26, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }
    .stat-label {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .stat-val {
      font-size: 20px;
      font-weight: 800;
      font-family: monospace;
      color: #f8fafc;
    }
    .workers-section {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .workers-title {
      font-size: 13px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 14px;
    }
    .worker-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 10px;
      font-size: 13px;
      font-family: monospace;
    }
    .worker-name { width: 90px; color: #cbd5e1; font-weight: 700; }
    .worker-bar-bg {
      flex: 1;
      height: 8px;
      background: rgba(2, 6, 23, 0.8);
      border-radius: 4px;
      overflow: hidden;
    }
    .worker-bar-fill {
      height: 100%;
      width: 0%;
      background: #38bdf8;
      border-radius: 4px;
      transition: width 0.3s ease;
    }
    .worker-count { width: 90px; text-align: right; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="hud-card">
    <div class="hud-header">
      <div class="brand-title">
        <div class="pulse-dot"></div>
        <span>BENAQAAB INDIA RENDER ENGINE</span>
      </div>
      <div class="badge-gpu">⚡ 4x GPU WORKERS ACTIVE</div>
    </div>

    <div class="progress-section">
      <div class="progress-meta">
        <div class="percentage-big" id="pctText">0.0%</div>
        <div class="frames-count" id="framesText">0 / 9257 Frames</div>
      </div>
      <div class="bar-container">
        <div class="bar-fill" id="progressBar"></div>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-pill">
        <div class="stat-label">Render Speed</div>
        <div class="stat-val" id="fpsText" style="color:#10b981;">0.0 FPS</div>
      </div>
      <div class="stat-pill">
        <div class="stat-label">Time Remaining (ETA)</div>
        <div class="stat-val" id="etaText" style="color:#fbbf24;">Calculating...</div>
      </div>
      <div class="stat-pill">
        <div class="stat-label">Elapsed Time</div>
        <div class="stat-val" id="elText">0s</div>
      </div>
    </div>

    <div class="workers-section">
      <div class="workers-title">Parallel GPU Threads (Intel Core i7-1355U + Iris Xe)</div>
      <div id="workersList"></div>
    </div>
  </div>

  <script>
    async function updateTelemetry() {
      try {
        const res = await fetch('render_status.json?nocache=' + Date.now());
        if (!res.ok) return;
        const data = await res.json();

        if (data.status === 'completed') {
          document.getElementById('pctText').textContent = '100%';
          document.getElementById('pctText').style.color = '#10b981';
          document.getElementById('progressBar').style.width = '100%';
          document.getElementById('progressBar').style.background = '#10b981';
          document.getElementById('framesText').textContent = `${data.total_frames} / ${data.total_frames} Frames (DONE)`;
          document.getElementById('etaText').textContent = 'COMPLETED 🎉';
          document.getElementById('etaText').style.color = '#10b981';
          document.getElementById('elText').textContent = data.total_render_time_formatted;
          return;
        }

        const pct = data.percent_complete || 0;
        document.getElementById('pctText').textContent = pct.toFixed(1) + '%';
        document.getElementById('progressBar').style.width = pct + '%';
        document.getElementById('framesText').textContent = `${data.rendered_frames} / ${data.total_frames} Frames`;
        document.getElementById('fpsText').textContent = `${data.fps} FPS`;
        document.getElementById('etaText').textContent = data.eta_formatted || 'Calculating...';
        document.getElementById('elText').textContent = Math.round(data.elapsed_seconds) + 's';

        const workersContainer = document.getElementById('workersList');
        workersContainer.innerHTML = '';
        const targetPerWorker = Math.round(data.total_frames / 4);
        
        for (const [wName, count] of Object.entries(data.workers || {})) {
          const wPct = Math.min(100, Math.round((count / targetPerWorker) * 100));
          const row = document.createElement('div');
          row.className = 'worker-row';
          row.innerHTML = `
            <div class="worker-name">${wName.toUpperCase()}</div>
            <div class="worker-bar-bg">
              <div class="worker-bar-fill" style="width: ${wPct}%"></div>
            </div>
            <div class="worker-count">${count} frames</div>
          `;
          workersContainer.appendChild(row);
        }
      } catch (e) {
        console.error(e);
      }
    }

    setInterval(updateTelemetry, 1000);
    updateTelemetry();
  </script>
</body>
</html>
