<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benaqaab Forensics · Reusable Motion Boilerplate</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #070b14;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }
  #stage {
    display: block;
    max-height: 96vh;
    aspect-ratio: 9/16;
    box-shadow: 0 25px 60px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.1);
    background: #060a12;
  }
</style>
</head>
<body>

<canvas id="stage" width="1080" height="1920"></canvas>

<script>
(() => {
  'use strict';

  // 1. DETERMINISTIC CONTRACT FOR hrender.py
  const W = 1080, H = 1920, FPS = 30, DURATION = 15.0;
  window.DURATION = DURATION;
  window.FPS = FPS;
  window.WIDTH = W;
  window.HEIGHT = H;
  window.ready = true;

  // 2. DATA-TO-DOM FACT LEDGER ARCHITECTURE
  const FACT_LEDGER = {
    caseId: "CASE #IND-402-26",
    topic: "AIRLINE FARE SURCHARGE SPIKE",
    headlineHi: "फ्लाइट टिकट पर ₹10,000 का 'सीक्रेट' सरचार्ज?",
    baseFare: 4200,
    surchargeAmount: 10000,
    spikePercentage: 238,
    sourceAgency: "DGCA NOTIFICATION REF-2026/09",
    sourceDocumentDate: "2026-10-06",
    verdict: "UNJUSTIFIED EXTRACTION",
    verdictHi: "सबूत: मनमाना सरचार्ज"
  };

  const cvs = document.getElementById('stage');
  const ctx = cvs.getContext('2d');

  // 3. THE 5 FORENSIC MOTION PRIMITIVES

  // Primitive 1: Rolling Numeric Odometer
  function drawOdometer(ctx, t, startT, duration, startVal, targetVal, x, y) {
    if (t < startT) return;
    const p = Math.max(0, Math.min(1, (t - startT) / duration));
    const eased = p === 1 ? 1 : 1 - Math.pow(2, -10 * p); // outExpo
    const current = Math.round(startVal + (targetVal - startVal) * eased);
    
    ctx.save();
    ctx.font = '900 110px monospace';
    ctx.fillStyle = '#ef4444';
    ctx.shadowColor = 'rgba(239, 68, 68, 0.6)';
    ctx.shadowBlur = 25;
    ctx.textAlign = 'center';
    ctx.fillText(`+ ₹${current.toLocaleString('en-IN')}`, x, y);
    ctx.restore();
  }

  // Primitive 2: Yellow Forensic Highlighter Sweep
  function drawHighlighter(ctx, t, startT, duration, x, y, width, height) {
    if (t < startT) return;
    const p = Math.max(0, Math.min(1, (t - startT) / duration));
    const easedWidth = width * (1 - Math.pow(1 - p, 3)); // outCubic
    
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = 'rgba(250, 204, 21, 0.65)'; // Fluorescent Marker Yellow
    ctx.fillRect(x, y, easedWidth, height);
    ctx.restore();
  }

  // Primitive 3: Classified Redaction Tape Peel
  function drawRedactionPeel(ctx, t, startT, duration, x, y, width, height) {
    let offset = 0;
    if (t >= startT) {
      const p = Math.max(0, Math.min(1, (t - startT) / duration));
      offset = (p * (2 - p)) * (width + 40); // outQuad slide
    }
    const remainingW = Math.max(0, width - offset);
    if (remainingW <= 0) return;

    ctx.save();
    ctx.fillStyle = '#09090b'; // Heavy matte black
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 10;
    ctx.fillRect(x + offset, y, remainingW, height);
    
    if (offset < width * 0.4) {
      ctx.fillStyle = '#71717a';
      ctx.font = '700 18px monospace';
      ctx.fillText('TOP SECRET · PENDING VERIFICATION', x + 20 + offset, y + height * 0.65);
    }
    ctx.restore();
  }

  // Primitive 4: Evidence Loupe / Zoom Lens
  function drawEvidenceLoupe(ctx, t, startT, x, y, radius, zoomScale = 2.0) {
    if (t < startT) return;
    const p = Math.max(0, Math.min(1, (t - startT) / 0.8));
    const scale = 0.3 + 0.7 * (1 - Math.exp(-p * 8) * Math.cos(p * 12));

    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    // Outer Housing
    ctx.shadowColor = 'rgba(0,0,0,0.6)';
    ctx.shadowBlur = 25;
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.stroke();

    // Glass tint
    ctx.fillStyle = 'rgba(56, 189, 248, 0.08)';
    ctx.fill();
    ctx.shadowBlur = 0;

    // Crosshairs
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.5)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-radius + 15, 0); ctx.lineTo(radius - 15, 0);
    ctx.moveTo(0, -radius + 15); ctx.lineTo(0, radius - 15);
    ctx.stroke();

    // Callout Tag
    ctx.fillStyle = '#0f172a';
    ctx.beginPath();
    ctx.roundRect(40, -radius, 140, 38, 8);
    ctx.fill();
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = '#38bdf8';
    ctx.font = '700 14px monospace';
    ctx.fillText('VERIFIED 2X', 60, -radius + 24);

    ctx.restore();
  }

  // Primitive 5: Slamming Rubber Verdict Stamp
  function drawVerdictStamp(ctx, t, hitT, textEn, textHi, cx, cy) {
    if (t < hitT) return;
    const p = t - hitT;
    
    const w0 = 14, z = 0.65;
    const springP = 1 - Math.exp(-p * z * w0) * (Math.cos(p * w0 * Math.sqrt(1 - z * z)));
    const scale = 2.8 - (2.8 - 1.0) * Math.min(1.2, springP);

    const impact = Math.max(0, 1 - (p * 4));
    const shakeX = Math.sin(t * 80) * 8 * impact;
    const shakeY = Math.cos(t * 70) * 8 * impact;

    ctx.save();
    ctx.translate(cx + shakeX, cy + shakeY);
    ctx.rotate(-0.08);
    ctx.scale(scale, scale);

    // Heavy Outer Border
    ctx.strokeStyle = '#dc2626';
    ctx.lineWidth = 10;
    ctx.beginPath();
    ctx.roundRect(-360, -90, 720, 180, 20);
    ctx.stroke();

    // Inner Double Border
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.roundRect(-345, -75, 690, 150, 12);
    ctx.stroke();

    // Text
    ctx.fillStyle = '#ef4444';
    ctx.textAlign = 'center';
    ctx.font = '900 52px -apple-system, sans-serif';
    ctx.fillText(textEn, 0, -10);

    ctx.fillStyle = '#fca5a5';
    ctx.font = '800 34px sans-serif';
    ctx.fillText(textHi, 0, 48);

    ctx.restore();
  }

  // 4. MAIN DETERMINISTIC DRAW FUNCTION
  window.seek = function(t) {
    ctx.clearRect(0, 0, W, H);

    // Layer 1: Blueprint Forensic Background
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#060a12');
    bg.addColorStop(1, '#0b1324');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // Grid dots
    ctx.fillStyle = 'rgba(148, 163, 184, 0.08)';
    for (let x = 40; x < W; x += 60) {
      for (let y = 40; y < H; y += 60) {
        ctx.fillRect(x, y, 2, 2);
      }
    }

    // Top-Left Logo Safe Area (X: 80 to 900 | Y: 240 to 1480 Safe Workspace)
    // Logo Bug at top safe zone
    ctx.save();
    ctx.fillStyle = 'rgba(10, 15, 22, 0.72)';
    ctx.strokeStyle = 'rgba(251, 191, 36, 0.4)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(80, 80, 260, 52, 10);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#f8fafc';
    ctx.font = '800 18px monospace';
    ctx.fillText('BENAQAAB FORENSICS', 98, 112);
    ctx.restore();

    // Case ID Tag
    ctx.save();
    ctx.fillStyle = '#38bdf8';
    ctx.font = '700 20px monospace';
    ctx.fillText(FACT_LEDGER.caseId, 80, 280);
    ctx.fillStyle = '#94a3b8';
    ctx.font = '600 24px sans-serif';
    ctx.fillText(FACT_LEDGER.topic, 80, 320);
    ctx.restore();

    // Scene 1: Odometer Hook (t: 0 - 5.0)
    if (t < 5.0) {
      ctx.save();
      ctx.fillStyle = '#f8fafc';
      ctx.font = '800 48px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(FACT_LEDGER.headlineHi, W / 2, 540);
      ctx.fillStyle = '#94a3b8';
      ctx.font = '700 28px monospace';
      ctx.fillText(`BASE FARE: ₹${FACT_LEDGER.baseFare}`, W / 2, 640);
      ctx.restore();

      drawOdometer(ctx, t, 0.8, 2.2, 0, FACT_LEDGER.surchargeAmount, W / 2, 780);
      drawEvidenceLoupe(ctx, t, 3.2, 720, 750, 90, 2.0);
    }
    // Scene 2: Gazette Document, Highlighter & Redaction Peel (t: 5.0 - 10.0)
    else if (t < 10.0) {
      // Document Sheet inside safe area
      ctx.save();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.roundRect(100, 420, 880, 700, 16);
      ctx.fill();

      // Document Text
      ctx.fillStyle = '#0f172a';
      ctx.font = '800 32px sans-serif';
      ctx.fillText(`OFFICIAL GAZETTE · ${FACT_LEDGER.sourceAgency}`, 140, 500);
      ctx.font = '500 24px monospace';
      ctx.fillStyle = '#334155';
      ctx.fillText(`DATE OF AUDIT: ${FACT_LEDGER.sourceDocumentDate}`, 140, 550);
      ctx.fillText("PARAGRAPH 14(B): AIRLINE PASSENGER EXTRACTION", 140, 620);
      ctx.fillText(`SPIKE RATIO: +${FACT_LEDGER.spikePercentage}% UNACCOUNTED LEVY`, 140, 690);
      ctx.fillText("CLASSIFIED: ENFORCEMENT MEMO TO DGCA", 140, 760);
      ctx.restore();

      // Forensic Highlighter Sweep across paragraph
      drawHighlighter(ctx, t, 5.5, 1.8, 130, 660, 680, 45);

      // Redaction Tape Peel exposing bottom clause
      drawRedactionPeel(ctx, t, 7.2, 1.5, 130, 730, 640, 42);
    }
    // Scene 3: Verdict Shockwave Stamp (t: 10.0 - 15.0)
    else {
      ctx.save();
      ctx.fillStyle = '#f8fafc';
      ctx.font = '800 44px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText("FINAL FORENSIC VERDICT", W / 2, 500);
      ctx.fillStyle = '#ef4444';
      ctx.font = '800 32px monospace';
      ctx.fillText(`+${FACT_LEDGER.spikePercentage}% ILLEGAL LEVY CONFIRMED`, W / 2, 580);
      ctx.restore();

      drawVerdictStamp(ctx, t, 10.4, FACT_LEDGER.verdict, FACT_LEDGER.verdictHi, W / 2, 880);
    }
  };

  // Browser Scrubbing Preview Loop
  let curT = 0;
  function loop() {
    curT = (curT + 1 / FPS) % DURATION;
    window.seek(curT);
    requestAnimationFrame(loop);
  }
  window.seek(0);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
